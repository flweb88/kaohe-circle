function fmtRel(s){
  if (!s) return '';
  var d = new Date(String(s).replace(' ','T'));
  if (isNaN(d.getTime())) return s;
  var diff = (Date.now() - d.getTime())/1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
  if (diff < 86400*7) return Math.floor(diff/86400) + ' 天前';
  return String(s).slice(0,10);

function renderMediaCell(m, opts){
  if (m.status==='pending') return '<div class="media-ph"><span class="mp-ic">⏳</span>处理中…</div>';
  if (m.status==='failed') return '<div class="media-ph fail"><span class="mp-ic">⚠️</span>处理失败</div>';
  var dl = '';
  if (m.files){
    var v = (m.kind==='video' && m.files.video720) ? 'video720' : 'orig';
    if (m.files[v]){
      dl = '<a class="media-dl" href="' + mediaUrl(m.id,v) + '&fn=' + encodeURIComponent(m.files[v]) +
        '" download="' + esc(m.files[v]) + '" target="_blank" rel="noopener" title="下载">⬇</a>';
    }
  }
  if (m.kind==='image'){
    return '<div class="media-cell"><img src="' + mediaUrl(m.id,'sm') + '" data-orig="' + mediaUrl(m.id,'orig') + '" loading="lazy" ' +
      'onclick="loadOrig(this)" ' +
      'onerror="this.outerHTML=\'<div class=&quot;media-ph fail&quot;><span class=mp-ic>⚠️</span>加载失败</div>\'">' + dl + '</div>';
  }
  if (m.kind==='video'){
    // 优先 video720（工人转码/压缩统一 mp4 容器），无则回退 orig（mp4/webm 原生）；封面用 worker 抽帧 poster
    var vsrc = (m.url && m.url.video720) ? mediaUrl(m.id,'video720') : mediaUrl(m.id,'orig');
    var pattr = (m.url && m.url.poster) ? ' poster="' + mediaUrl(m.id,'poster') + '"' : '';
    return '<div class="media-cell"><video controls preload="metadata" src="' + vsrc + '"' + pattr +
      ' onerror="toast(\'当前浏览器不支持播放该视频格式\',\'warn\')"></video>' + dl + '</div>';
  }
  if (m.kind==='audio') return '<div class="media-cell audio-cell"><audio controls src="' + mediaUrl(m.id,'orig') + '" onerror="toast(\'当前浏览器不支持播放该音频格式\',\'warn\')"></audio>' + dl + '</div>';
  return '';
}

// v3.5.4：评论时间——今天显示 HH:mm；今年 MM-DD HH:mm；跨年 YYYY-MM-DD HH:mm
function fmtCmtDate(s){
  if (!s) return '';
  var d = new Date(String(s).replace(' ','T'));
  if (isNaN(d.getTime())) return s;
  var now = new Date();
  var pad = function(n){ return (n<10?'0':'')+n; };
  var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate()) return hm;
  if (d.getFullYear()===now.getFullYear()) return pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + hm;
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + hm;
}

function loadUserProfile(email){
  email = email || view.profileEmail;
  if (!email) return;
  postJSON('kaohe-api/social.php?action=user_profile', { token:Auth.token, email:email })
    .then(function(res){
      if (apiFail(res)) return;
      if (res.json && res.json.ok){
        _upData = res.json;
        render();
      } else {
        // 降级：user_profile 未实现时用 search_users + posts_of 拼接
        loadUserProfileFallback(email);
      }
    })
    .catch(function(){
      loadUserProfileFallback(email);
    });
}
/* 降级方案：user_profile 接口未上线时，用现有接口拼接用户主页数据 */
function loadUserProfileFallback(email){
  // 并行拉：search_users 找用户 + posts_of 拉帖子
  Promise.all([
    postJSON('kaohe-api/social.php?action=search_users', { token:Auth.token, q:email }),
    postJSON('kaohe-api/social.php?action=posts_of', { token:Auth.token, email:email })
  ]).then(function(results){
    var searchRes = results[0], postsRes = results[1];
    var user = null;
    if (searchRes.json && searchRes.json.ok){
      var users = searchRes.json.users || [];
      for (var i=0;i<users.length;i++){
        if ((users[i].email||'').toLowerCase() === email.toLowerCase()){ user = users[i]; break; }
      }
    }
    if (!user){
      _upData = { ok:false, msg:'用户不存在或已注销' };
      render(); return;
    }
    var posts = (postsRes.json && postsRes.json.ok) ? (postsRes.json.posts||[]) : [];
    _upData = {
      ok: true,
      user: user,
      relation: { following:false, following_me:false, mutual:false, blocked:false, blocked_by:false, muted:false },
      posts: posts,
      empty: null
    };
    render();
  }).catch(function(){
    _upData = { ok:false, msg:'网络错误' };
    render();
  });
}

function loadUserList(reset){
  if (view.userListLoading) return;
  view.userListLoading = true;
  if (!reset){
    var listEl = document.getElementById('ul-list-body');
    if (listEl){
      var btn = listEl.querySelector('.ul-loadmore button');
      if (btn) btn.textContent = '加载中…';
    }
  }
  var action = view.userListMode === 'following' ? 'following' : 'followers';
  var payload = { token:Auth.token, email: view.userListEmail, cursor: view.userListCursor, limit:20 };
  postJSON('kaohe-api/social.php?action=' + action, payload)
    .then(function(res){
      view.userListLoading = false;
      if (apiFail(res)) return;
      if (res.json && res.json.ok){
        var users = res.json.users || [];
        if (reset) view.userListUsers = users;
        else view.userListUsers = view.userListUsers.concat(users);
        view.userListCursor = res.json.nextCursor || null;
        view.userListNoMore = !res.json.nextCursor;
      } else {
        toast(apiMsg(res), 'warn');
      }
      render();
    })
    .catch(function(){
      view.userListLoading = false;
      toast('网络错误', 'warn');
      render();
    });
}

function renderUserList(){
  var mode = view.userListMode || 'following';
  var title = mode === 'following' ? '正在关注' : '粉丝';
  var topbar = '<div class="pd-topbar"><button class="btn btn-ghost btn-sm" data-action="back">‹ 返回</button>' +

    return topbar + '<div class="ul-empty"><div class="t">' + (mode==='following'?'还没有关注任何人':'还没有粉丝') + '</div><div>' + (mode==='following'?'去推荐页看看大家吧':'关注你的人会出现在这里') + '</div></div>';

/* @昵称跳转：先搜索再进入主页 */
var _nickCache = {};  // nickname -> email 缓存
function gotoUserByNick(nick){
  if (!nick) return;
  nick = nick.replace(/^@/, '');
  if (_nickCache[nick]){ openUserProfile(_nickCache[nick]); return; }
  postJSON('kaohe-api/social.php?action=search_users', { token:Auth.token, q:nick })
    .then(function(res){
      if (apiFail(res)) return;
      if (res.json && res.json.ok){
        var users = res.json.users || [];
        var found = null;
        for (var i=0;i<users.length;i++){
          if ((users[i].nickname||'') === nick){ found = users[i]; break; }
        }
        if (!found && users.length) found = users[0];
        if (found){
          _nickCache[nick] = found.email;
          openUserProfile(found.email);
        } else toast('未找到用户 @' + nick, 'warn');
      } else toast(apiMsg(res), 'warn');
    })
    .catch(function(){ toast('网络错误', 'warn'); });
}
function loadFeed(tab, reset){
  ensureFeedState();
  var s = view.feed[tab];
  if (s.loading) return;
  if (reset){
    s.posts = []; s.cursor = null; s.error = null; s.loaded = false; s.noMore = false;
    if (tab==='recommend') view.feedSeen = {};
  }
  s.loading = true;
  updateFeedList();
  postJSON('kaohe-api/social.php?action=feed', { token:Auth.token, tab:tab, cursor:s.cursor, limit:20 })
    .then(function(res){
      s.loading = false;
      if (apiFail(res)) return;
      if (res.json && res.json.ok){
        var posts = res.json.posts || [];
        if (tab==='recommend'){
          var fresh = [];
          posts.forEach(function(p){
            if (!view.feedSeen[p.id]){ view.feedSeen[p.id] = 1; fresh.push(p); }
          });
          s.posts = (reset ? fresh : s.posts.concat(fresh));
          s.noMore = posts.length < 20;
        } else {
          s.empty = res.json.empty || null;
          s.posts = (reset ? posts : s.posts.concat(posts));
          s.cursor = res.json.nextCursor || null;
          s.noMore = !res.json.nextCursor;
        }
        s.loaded = true;
        s.error = null;
      } else {
        s.error = apiMsg(res);
      }
      updateFeedList();
    })
    .catch(function(){
      s.loading = false; s.error = '网络错误，请检查连接';
      updateFeedList();
    });
}
function refreshFeed(){
  var t = view.circleTab || 'recommend';
  loadFeed(t, true);
}

/* ---- 互动 ---- */
function toggleLike(postId, el){
  var turningOn = !el.classList.contains('on');
  el.classList.toggle('on', turningOn);
  el.classList.toggle('liked', turningOn);
  var ic = el.querySelector('i');
  if (ic){ var n = parseInt(ic.textContent,10)||0; ic.textContent = turningOn ? n+1 : Math.max(0,n-1); }
  postJSON('kaohe-api/social.php?action=' + (turningOn?'like':'unlike'), { token:Auth.token, id:postId })
    .then(function(r){
      if (apiFail(r)) return;
      if (r.json && r.json.ok){
        if (r.json.likeCount!=null && ic) ic.textContent = r.json.likeCount;
      } else {
        el.classList.toggle('on', !turningOn);
        el.classList.toggle('liked', !turningOn);
        if (ic) ic.textContent = (parseInt(ic.textContent,10)||0) + (turningOn?-1:1);
        if (r.json && r.json.err==='notfound'){ removePostCard(postId); toast('动态已删除','warn'); }
        else toast(apiMsg(r),'warn');
      }
    })
    .catch(function(){
      el.classList.toggle('on', !turningOn);
      el.classList.toggle('liked', !turningOn);
      toast('网络错误','warn');
    });
}
function toggleBookmark(postId, el){
  var turningOn = !el.classList.contains('on');
  el.classList.toggle('on', turningOn);
  postJSON('kaohe-api/social.php?action=' + (turningOn?'bookmark':'unbookmark'), { token:Auth.token, id:postId })
    .then(function(r){
      if (apiFail(r)) return;
      if (r.json && r.json.ok){ toast(turningOn?'已收藏':'已取消收藏','good'); }
      else {
        el.classList.toggle('on', !turningOn);
        if (r.json && r.json.err==='notfound') removePostCard(postId);
        else toast(apiMsg(r),'warn');
      }
    })
    .catch(function(){ el.classList.toggle('on', !turningOn); toast('网络错误','warn'); });
}

// v3.5.5：纯转发 action=repost（不带 text）；已转发再点=unrepost 取消；计数用返回 repostCount
function doRepost(postId){
  var barEl = document.querySelector('.pa-item[data-action="toggle-repost"][data-id="' + postId + '"]');
  var turningOff = barEl ? barEl.classList.contains('on') : false;
  var act = turningOff ? 'unrepost' : 'repost';
  postJSON('kaohe-api/social.php?action=' + act, { token:Auth.token, id:postId })
    .then(function(r){
      if (apiFail(r)) return;
      if (r.json && r.json.ok){
        var on = !turningOff;
        // 更新所有该帖 🔁 入口（卡片 + 详情页）
        document.querySelectorAll('.pa-item[data-action="toggle-repost"][data-id="' + postId + '"]').forEach(function(el){
          el.classList.toggle('on', on);
          var ic = el.querySelector('i');
          if (ic && r.json.repostCount!=null) ic.textContent = r.json.repostCount;
        });
        // 同步本地 feed 数据
        ensureFeedState();
        ['recommend','follow'].forEach(function(t){
          view.feed[t].posts.forEach(function(p){
            if (p.id===postId){ p.reposted = on; if (r.json.repostCount!=null) p.repostCount = r.json.repostCount; }
          });
        });
        toast(turningOff ? '已取消转发' : '已转发', 'good');
        closeModal();
      } else {
        if (r.json && r.json.err==='notfound'){ removePostCard(postId); toast('动态已删除','warn'); }
        else toast(apiMsg(r),'warn');
      }
    })

}
// v3.5.5 回复组件：头像+昵称+日期+正文+媒体+❤️/🔖/🔁/🗑+嵌套回复；ctx={postId,postAuthor,isPostAuthor}
// 适配 v3.5.5：Thread 串文（作者本人回复标 🧵）、作者可隐藏/取消隐藏回复、已隐藏回复样式
function cmtItemHtml(c, withReplyBox, ctx){
  ctx = ctx || {};
  var text = esc(c.text||'');
  text = text.replace(/@([^\s@，。,.!！?？:：;；、<]+)/g, '<span class="mention" data-action="goto-user-nick" data-nick="$1">@$1</span>');
  var repTag = c.replyNick ? ' <span class="cmt-reply-tag">回复 @' + esc(c.replyNick) + '</span>' : '';
  var media = (c.media && c.media.length)
    ? '<div class="cmt-media cols-' + Math.min(c.media.length,3) + '">' + c.media.map(function(m){ return renderMediaCell(m); }).join('') + '</div>'
    : '';
  // v3.5.5：Thread 串联——回复作者==详情帖作者 → 标 🧵 + thread 样式
  var isThread = ctx.postAuthor && (c.author === ctx.postAuthor);
  var threadMark = isThread ? '<span class="thread-mark" title="串文">🧵</span>' : '';
  // v3.5.5：详情帖作者（非回复者本人）可隐藏/取消隐藏某条回复；非作者不显示
  var pid = ctx.postId || c.post_id || '';
  var hideBtn = '';
  if (ctx.isPostAuthor && !c.mine){
    hideBtn = c.hidden
      ? '<span class="ca hide-ca" data-action="unhide-reply" data-id="' + pid + '" data-rid="' + c.id + '">取消隐藏</span>'
      : '<span class="ca hide-ca" data-action="hide-reply" data-id="' + pid + '" data-rid="' + c.id + '">隐藏</span>';
  }
  var acts = '<div class="cmt-acts">' +
    '<span class="ca ' + (c.liked?'on liked':'') + '" data-action="cmt-like" data-id="' + c.id + '">❤️<i>' + (c.likeCount||0) + '</i></span>' +
    '<span class="ca ' + (c.bookmarked?'on':'') + '" data-action="cmt-bookmark" data-id="' + c.id + '">🔖</span>' +
    '<span class="ca" data-action="cmt-reply" data-id="' + c.id + '">💬 回复</span>' +
    '<span class="ca" data-action="cmt-repost" data-id="' + c.id + '">🔁 转发</span>' +
    hideBtn +
    (c.mine ? '<span class="ca" data-action="del-comment" data-id="' + c.id + '" data-pid="' + pid + '">🗑</span>' : '') +
  '</div>';
  var rpBox = withReplyBox
    ? '<div class="cmt-reply-box" hidden><input type="text" placeholder="回复 ' + esc(c.authorNick||'') + '…" maxlength="200">' +
      '<button class="btn btn-primary btn-sm" data-action="send-cmt-reply" data-id="' + c.id + '" data-pid="' + pid + '">回复</button></div>'
    : '';
  // v3.5.5：时间兼容 c.at(旧) / c.createdAt(新)；已隐藏回复加样式类
  var when = fmtCmtDate(c.at || c.createdAt);
  var itemCls = 'cmt-item' + (isThread ? ' thread' : '') + (c.hidden ? ' is-hidden' : '');
  return '<div class="' + itemCls + '" data-cid="' + c.id + '">' +
    '<div class="cmt-head"><img class="cmt-ava" src="' + avatarUrl(c.authorAvatar) + '" alt="" onerror="this.style.opacity=.4" data-action="goto-user" data-email="' + esc(c.author||'') + '">' +
    '<div class="cmt-who"><div class="cmt-nick" data-action="goto-user" data-email="' + esc(c.author||'') + '">' + threadMark + esc(c.authorNick||'已注销') + (c.hidden ? ' <span class="cmt-hidden-tag">已隐藏</span>' : '') + '</div>' +
    '<div class="cmt-time">' + when + '</div></div></div>' +
    '<div class="cmt-body">' + repTag + text + '</div>' +
    media + acts + rpBox + '</div>';
}
// v3.5.5：把 rootComments/replies 分组渲染为回复树（root 可回复、replies 嵌套「回复@谁」）
function renderCommentGroups(groups, ctx){
  if (!groups || !groups.length) return '';
  return groups.map(function(g){
    var rh = cmtItemHtml(g.root, true, ctx);
    var rpHtml = '';
    if (g.replies && g.replies.length) rpHtml = '<div class="cmt-replies">' + g.replies.map(function(rp){ return cmtItemHtml(rp, false, ctx); }).join('') + '</div>';
    return rh + rpHtml;
  }).join('');
}
// v3.5.5：同步回复数 UI（评论头 + 详情操作条 💬 + feed 卡片本地数据）
function updateCmtCountUI(postId, count){
  if (count==null) return;
  var hd = document.getElementById('pd-cmt-cnt');
  if (hd) hd.textContent = count;
  var pdI = document.querySelector('.post-detail-main[data-id="' + postId + '"] .cmt-count-i i');
  if (pdI) pdI.textContent = count;
  var cardI = document.querySelector('.post[data-id="' + postId + '"] .pa-item[data-action="open-post-detail"] i');
  if (cardI) cardI.textContent = count;
  ensureFeedState();
  ['recommend','follow'].forEach(function(t){
    view.feed[t].posts.forEach(function(p){ if (p.id===postId) p.commentCount = count; });
  });
}
function loadComments(postId){
  var list = document.getElementById('cmt-list-' + postId);
  if (!list) return;
  list.innerHTML = '<div class="feed-loading" style="padding:14px">加载回复…</div>';
  var p = findPostInFeed(postId) || {};
  var me = Auth.user || {};
  var isPostAuthor = (p.author === (me.email||'').toLowerCase());
  var ctx = { postId: postId, postAuthor: p.author, isPostAuthor: isPostAuthor };
  // v3.5.5：作者可见时带 include_hidden=1，一次性拿隐藏区；非作者后端不返回 hidden
  var payload = { token:Auth.token, id:postId };
  if (isPostAuthor) payload.include_hidden = 1;
  postJSON('kaohe-api/social.php?action=comments_of', payload)
    .then(function(r){
      if (apiFail(r)) return;
      if (r.json && r.json.ok){
        var count = (r.json.commentCount != null) ? r.json.commentCount : 0;
        updateCmtCountUI(postId, count);
        var roots = r.json.rootComments || [];
        // 已隐藏回复入口（仅作者可见）：hiddenComments 为 rootComments 同构分组或扁平列表
        var hEntry = document.getElementById('hidden-cmt-entry');
        if (hEntry){
          var hc = r.json.hiddenComments || [];
          var hcArr = hc.map(function(x){ return (x && x.root) ? x : { root:x, replies:[] }; });
          if (isPostAuthor && hcArr.length){
            hEntry.innerHTML = '<div class="hide-entry" data-action="toggle-hidden-block">' +
              '<span>已隐藏回复 (' + hcArr.length + ')</span><span class="he-arrow">▾</span></div>' +
              '<div class="hidden-cmt-block" hidden>' + renderCommentGroups(hcArr, ctx) + '</div>';
          } else hEntry.innerHTML = '';
        }
        if (!roots.length){ list.innerHTML = '<div class="cmt-empty">还没有回复，来抢沙发</div>'; return; }
        list.innerHTML = renderCommentGroups(roots, ctx);
      } else {
        list.innerHTML = '<div class="cmt-empty" style="color:var(--danger)">回复加载失败</div>';
      }
    })
    .catch(function(){ list.innerHTML = '<div class="cmt-empty" style="color:var(--danger)">网络错误</div>'; });
}
// v3.5.5：展开/收起已隐藏回复区
function toggleHiddenBlock(){
  var blk = document.querySelector('.hidden-cmt-block');
  if (!blk) return;
  var opening = blk.hasAttribute('hidden');
  blk.toggleAttribute('hidden', !opening);
  var arr = document.querySelector('.hide-entry .he-arrow');
  if (arr) arr.textContent = opening ? '▴' : '▾';
}
// v3.5.5：根帖作者隐藏/取消隐藏某条回复（hide_reply/unhide_reply；非作者后端 403）
function hideReply(postId, replyId, hidden){

// v3.5.5：作者修改自己帖的回复范围（reply_settings：all/following/mentioned）

  postJSON('kaohe-api/social.php?action=reply_settings', { token:Auth.token, id:postId, reply_policy:policy })

// v3.5.4 评论互动
function cmtLike(cid, el){
  var turningOn = !el.classList.contains('on');
  el.classList.toggle('on', turningOn);
  el.classList.toggle('liked', turningOn);
  var ic = el.querySelector('i');
  if (ic){ var n = parseInt(ic.textContent,10)||0; ic.textContent = turningOn ? n+1 : Math.max(0,n-1); }
  postJSON('kaohe-api/social.php?action=' + (turningOn?'comment_like':'comment_unlike'), { token:Auth.token, id:cid })
    .then(function(r){
      if (apiFail(r)) return;
      if (r.json && r.json.ok){
        if (r.json.likeCount!=null && ic) ic.textContent = r.json.likeCount;
      } else {
        el.classList.toggle('on', !turningOn); el.classList.toggle('liked', !turningOn);
        if (ic) ic.textContent = (parseInt(ic.textContent,10)||0) + (turningOn?-1:1);
        toast(apiMsg(r),'warn');
      }
    })
    .catch(function(){ el.classList.toggle('on', !turningOn); el.classList.toggle('liked', !turningOn); toast('网络错误','warn'); });
}
function cmtBookmark(cid, el){
  var turningOn = !el.classList.contains('on');
  el.classList.toggle('on', turningOn);
  postJSON('kaohe-api/social.php?action=' + (turningOn?'comment_bookmark':'comment_unbookmark'), { token:Auth.token, id:cid })
    .then(function(r){
      if (apiFail(r)) return;
      if (r.json && r.json.ok) toast(turningOn?'已收藏评论':'已取消收藏评论','good');
      else { el.classList.toggle('on', !turningOn); toast(apiMsg(r),'warn'); }
    })
    .catch(function(){ el.classList.toggle('on', !turningOn); toast('网络错误','warn'); });
}
function cmtReplyToggle(cid){

  var opening = box.hasAttribute('hidden');

// v3.5.5：回复某条回复 → action=post + reply_to_post_id=该回复帖 id（不再调 action=comment）
function sendCmtReply(rootCid, postId){

// v3.5.4 详情页底部固定评论输入（支持挂媒体）
function renderCmtMediaRow(postId){
  var row = document.getElementById('pd-cmt-media-' + postId);
  if (!row) return;
  var med = (view.cmtMedia && view.cmtMedia[postId]) ? view.cmtMedia[postId] : [];
  row.innerHTML = med.map(function(m,i){
    var badge = m.status==='pending' ? '<span class="cm-badge pend">处理中…</span>'
      : (m.status==='failed' ? '<span class="cm-badge fail">失败 ✕</span>' : '<span class="cm-badge ok">已就绪</span>');

    else if (m.kind==='video') preview = '<div class="cm-mediaplay">🎬</div>';
    else preview = '<div class="cm-mediaplay">🎵</div>';
    return '<div class="cm-media" style="position:relative">' + preview + badge +
      '<span style="position:absolute;top:2px;right:4px;color:#fff;background:rgba(0,0,0,.4);border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;text-align:center;cursor:pointer" data-action="cmt-remove-media" data-pid="' + postId + '" data-i="' + i + '">✕</span></div>';
  }).join('') || '';
}
// v3.5.5：详情页底部固定输入 → action=post + reply_to_post_id=当前详情帖 id（不再调 action=comment）
function sendComment(postId){
  var inp = document.getElementById('cmt-inp-' + postId);
  var text = inp ? inp.value.trim() : '';
  var med = (view.cmtMedia && view.cmtMedia[postId]) ? view.cmtMedia[postId].slice() : [];
  if (!text && !med.length){ toast('回复内容不能为空','warn'); return; }
  var payload = { token:Auth.token, reply_to_post_id:postId, text:text };
  if (med.length) payload.media = med.map(function(m){ return m.id; });
  postJSON('kaohe-api/social.php?action=post', payload)
    .then(function(r){
      if (apiFail(r)) return;
      if (r.json && r.json.ok){
        if (inp) inp.value = '';
        if (view.cmtMedia && view.cmtMedia[postId]) view.cmtMedia[postId] = [];
        renderCmtMediaRow(postId);

        toast('回复成功','good');
      } else {
        toast(apiMsg(r),'warn');
      }
    })
    .catch(function(){ toast('网络错误','warn'); });
}
function delPost(postId){

}

// v3.5.4：上传管线复用（主帖 compose / 评论 comment），白名单与限制同主帖（图10M/视频200M/音频50M，最多4）
function uploadMediaFile(file, target, postId){
  target = target || 'compose';
  ensureFeedState();
  var kind = null;
  if (/^image\//.test(file.type)) kind = 'image';
  else if (/^video\//.test(file.type)) kind = 'video';
  else if (/^audio\//.test(file.type)) kind = 'audio';
  if (!kind){ toast('不支持的文件类型：' + (file.type||'未知'),'warn'); return; }
  var maxB = kind==='image' ? 10*1024*1024 : (kind==='audio' ? 50*1024*1024 : 200*1024*1024);
  if (file.size > maxB){
    toast(kind==='image' ? '图片不能超过 10MB' : (kind==='audio' ? '音频不能超过 50MB' : '视频不能超过 200MB'),'warn');
    return;
  }
  if (target==='compose'){
    if (view.compose.media.length >= 4){ toast('最多 4 个媒体','warn'); return; }
  } else {
    if (!view.cmtMedia[postId]) view.cmtMedia[postId] = [];
    if (view.cmtMedia[postId].length >= 4){ toast('最多 4 个媒体','warn'); return; }
  }
  var fd = new FormData();
  fd.append('token', Auth.token);
  fd.append('file', file);
  toast('上传中…','good');
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'kaohe-api/media.php?action=upload');
  xhr.onload = function(){
    var j;
    try { j = JSON.parse(xhr.responseText); } catch(e){ toast('上传失败','warn'); return; }
    if (j && j.ok && j.media){
      if (target==='compose'){
        view.compose.media.push(j.media);
        toast('已上传，处理中','good');
        renderComposeModal();
      } else {
        view.cmtMedia[postId].push(j.media);
        toast('已上传，处理中','good');
        renderCmtMediaRow(postId);
      }
    } else {
      toast((j && j.msg) || '上传失败','warn');
    }
  };
  xhr.onerror = function(){ toast('上传中断，请重试','warn'); };
  xhr.send(fd);
}

function cmSubmit(){
  var c = view.compose;
  if (c.busy) return;
  var hasText = c.text.trim().length > 0;
  var hasMedia = c.media.length > 0;
  var hasScore = !!c.share_card;
  if (!hasText && !hasMedia && !hasScore){ toast('写点什么，或添加媒体/成绩卡','warn'); return; }
  if (c.text.length > 500){ toast('内容须 ≤500 字','warn'); return; }
  c.busy = true; renderComposeModal();
  var payload = { token:Auth.token, text:c.text.trim(), reply_policy:c.replyPolicy, client_req_id:'c' + Date.now() + Math.random().toString(36).slice(2,8) };
  if (c.media.length) payload.media = c.media.map(function(m){ return m.id; });
  if (c.share_card) payload.score = c.share_card;
  if (c.quoteOf) payload.quoted_post_id = c.quoteOf;  // v3.5.5：引用帖
  postJSON('kaohe-api/social.php?action=post', payload)
    .then(function(r){
      c.busy = false;

      if (r.json && r.json.ok){
        closeModal();
        toast(c.quoteOf ? '引用成功' : '发布成功','good');
        view.feed.recommend.posts.unshift(r.json.post);
        view.feed.recommend.loaded = true;
        view.feedSeen[r.json.post.id] = 1;
        // v3.8.0：若当前在首页「我的主页」子页，留在该子页并刷新本人动态（与 user-profile 页刷新方式一致）；否则维持原行为跳回动态推荐流

        } else {

        toast(apiMsg(r),'warn');

      }
    })

/* ---- 下拉刷新（移动端） ---- */
(function(){
  var ptrStartY = 0, tracking = false;
  document.addEventListener('touchstart', function(e){
    if (view.tab !== 'circle') return;
    if (window.scrollY > 0) return;
    var t = e.touches[0]; ptrStartY = t.clientY; tracking = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if (!tracking) return;
    var dy = e.touches[0].clientY - ptrStartY;
    var ind = document.querySelector('.ptr-ind');
    if (ind){
      if (dy > 60){ ind.textContent = '释放刷新…'; ind.classList.add('on'); }
      else if (dy > 10){ ind.textContent = '下拉刷新'; ind.classList.add('on'); }
      else ind.classList.remove('on');
    }
  }, {passive:true});
  document.addEventListener('touchend', function(){
    if (!tracking) return;
    tracking = false;
    var ind = document.querySelector('.ptr-ind');
    if (ind && ind.classList.contains('on')){
      ind.classList.remove('on');
      refreshFeed();
    }
  }, {passive:true});
})();

function ruleOverflow(el){
  var c = el.cloneNode(true);
  c.style.display = 'block';
  c.style.webkitLineClamp = 'none';
  c.style.webkitBoxOrient = 'initial';
  c.style.overflow = 'visible';
  c.style.position = 'absolute';
  c.style.visibility = 'hidden';
  c.style.left = '-9999px';
  c.style.top = '0';
  c.style.width = el.clientWidth + 'px';
  el.parentNode.appendChild(c);
  var full = c.offsetHeight;
  el.parentNode.removeChild(c);
  return full > el.clientHeight;
}
function bindHabitExpands(){
  var rules = document.querySelectorAll('#main .h-rule');
  for (var i=0;i<rules.length;i++){
    (function(el){
      if (el.getAttribute('data-bind')) return;
      el.setAttribute('data-bind','1');
      var more = document.createElement('span');
      more.className = 'h-rule-more';
      more.textContent = '展开';
      function toggleRule(){ var exp = el.classList.toggle('expanded'); more.textContent = exp ? '收起' : '展开'; }
      more.onclick = function(e){ e.stopPropagation(); toggleRule(); };
      el.onclick = function(){ toggleRule(); };
      el.parentNode.insertBefore(more, el.nextSibling);
      if (!ruleOverflow(el)) more.style.display = 'none';
    })(rules[i]);
  }
}

      doCheckin(id, HabitEngine.today(), minutes);

      break;
    case 'edit-checkin': editCheckinModal(id); break;
    case 'del-checkin': {
      var did = el.getAttribute('data-id'), didx = parseInt(el.getAttribute('data-idx'),10);
      var dl = state.checkins.filter(function(c){ return c.habitId===did && c.date===HabitEngine.today(); });
      if (didx>=0 && didx<dl.length){
        var tk = state.checkins.indexOf(dl[didx]);
        if (tk>=0) state.checkins.splice(tk,1);
        Store.save();
      }
      if (state.checkins.filter(function(c){ return c.habitId===did && c.date===HabitEngine.today(); }).length>0) editCheckinModal(did);
      else { closeModal(); render(); toast('已删除，今日记录已清空','good'); }

    case 'back-to-feed': backToFeed(); break;
    case 'cmt-like': cmtLike(el.getAttribute('data-id'), el); break;
    case 'cmt-bookmark': cmtBookmark(el.getAttribute('data-id'), el); break;
    case 'cmt-reply': cmtReplyToggle(el.getAttribute('data-id')); break;
    case 'cmt-repost': cmtRepost(el.getAttribute('data-id')); break;
    case 'del-comment': delComment(el.getAttribute('data-id'), el.getAttribute('data-pid')); break;
    case 'send-cmt-reply': sendCmtReply(el.getAttribute('data-id'), el.getAttribute('data-pid')); break;
    case 'hide-reply': hideReply(el.getAttribute('data-id'), el.getAttribute('data-rid'), true); break;
    case 'unhide-reply': hideReply(el.getAttribute('data-id'), el.getAttribute('data-rid'), false); break;
    case 'toggle-hidden-block': toggleHiddenBlock(); break;
    case 'rp-settings': openRpSettings(el.getAttribute('data-id')); break;
    case 'rp-pick': rpSettingsPick(el.getAttribute('data-id'), el.getAttribute('data-rp') || 'all'); break;
    case 'cmt-remove-media': {
      var cpid = el.getAttribute('data-pid');
      var ci = parseInt(el.getAttribute('data-i'),10);
      if (view.cmtMedia && view.cmtMedia[cpid] && view.cmtMedia[cpid][ci]){ view.cmtMedia[cpid].splice(ci,1); renderCmtMediaRow(cpid); }
      break;
    }
    case 'cm-add-media': {
      var tgt = el.getAttribute('data-target') || 'compose';
      var cpid2 = el.getAttribute('data-pid') || '';
      cmAddMedia(tgt, cpid2);
      break;
    }
    case 'cm-add-score': cmPickScore(); break;
    case 'cm-at': cmAtPicker(); break;
    case 'cm-rp': view.compose.replyPolicy = el.getAttribute('data-rp') || 'all'; renderComposeModal(); break;
    case 'cm-submit': cmSubmit(); break;
    case 'cm-remove-media': {
      var mi = parseInt(el.getAttribute('data-i'),10);
      if (!isNaN(mi) && view.compose.media[mi]){ view.compose.media.splice(mi,1); renderComposeModal(); }
      break;
    }
    case 'cm-remove-mention': {
      var ti = parseInt(el.getAttribute('data-i'),10);
      if (!isNaN(ti) && view.compose.mentions[ti]){ view.compose.mentions.splice(ti,1); renderComposeModal(); }
      break;
    }
    case 'cm-remove-score': view.compose.share_card = null; renderComposeModal(); break;
    case 'cm-pick-user': {
      var u = { email: el.getAttribute('data-email'), nickname: el.getAttribute('data-nick') };
      if (u.email && !view.compose.mentions.some(function(x){return x.email===u.email;})){
        view.compose.mentions.push(u);
        toast('已 @' + u.nickname, 'good');
      }
      break;
    }
    case 'cm-pick-score': {
      var si = parseInt(el.getAttribute('data-i'),10);
      if (!isNaN(si) && view._scoreCards && view._scoreCards[si]){
        view.compose.share_card = view._scoreCards[si];
        closeModal();
        renderComposeModal();
      }
      break;
    }
    /* ==== v3.6.0 用户关系网 ==== */
    case 'goto-user': openUserProfile(el.getAttribute('data-email')); break;
    case 'goto-user-nick': gotoUserByNick(el.getAttribute('data-nick')); break;
    case 'back':
      // 用户主页/列表返回：回到上一个合理的 tab
      if (view.postDetail){ backToFeed(); }
      else if (view.tab === 'user-list'){
        // v3.8.0：若从首页「我的主页」子页进入关注/粉丝列表，返回该子页；否则维持原行为回「我的」
        if (view._ulReturn === 'today-profile'){
          view.tab = 'today'; view.homeTab = 'profile'; view._ulReturn = null; render();
        } else {
          view.tab = 'me'; render();
        }
      }
      else if (view.tab === 'user-profile'){
        view.tab = 'me'; render();
      }
      break;
    case 'up-follow': doFollow(el.getAttribute('data-email'), null); break;
    case 'up-unfollow': doUnfollow(el.getAttribute('data-email'), null); break;
    case 'up-unblock': doUnblock(el.getAttribute('data-email')); break;
    case 'up-unmute': doUnmute(el.getAttribute('data-email')); break;
    case 'open-user-menu': openUserMenu(el.getAttribute('data-email')); break;
    case 'up-block-menu': doBlock(el.getAttribute('data-email')); break;
    case 'up-unblock-menu': doUnblock(el.getAttribute('data-email')); break;
    case 'up-mute-menu': doMute(el.getAttribute('data-email')); break;
    case 'up-unmute-menu': doUnmute(el.getAttribute('data-email')); break;
    case 'open-user-list':
      openUserList(el.getAttribute('data-mode'), el.getAttribute('data-email')); break;
    case 'ul-follow': doFollow(el.getAttribute('data-email'), el); break;
    case 'ul-unfollow': doUnfollow(el.getAttribute('data-email'), el); break;
    case 'ul-remove-follower': doRemoveFollower(el.getAttribute('data-email')); break;
    case 'ul-loadmore': loadUserList(false); break;
    case 'open-bio-edit': openBioModal(); break;
    case 'pf-save-bio': saveBio(); break;
    /* ==== v3.7.0 私信与通知 ==== */
    case 'msgs-sub-tab':
      view.msgsSubTab = el.getAttribute('data-st') === 'notif' ? 'notif' : 'dm';
      render();
      if (view.msgsSubTab === 'dm') loadConversations();
      else loadNotif();
      break;
    case 'open-conv': openConversation(el.getAttribute('data-id')); break;
    case 'close-conv': closeConversation(); break;
    case 'dm-send': sendDm(); break;
    case 'open-dm-from-profile': openOrCreateDm(el.getAttribute('data-email')); break;
    case 'notif-mark-all': markAllNotifRead(); break;
    case 'notif-row': handleNotifRow(el); break;
    case 'close-modal':
      if (!canCloseModal()) break;  // 弹窗刚打开 350ms 内的关闭点击忽略（防连点/误触）
      closeModal(); break;
  }
}
window.addEventListener('error', function(ev){
  try{ toast('页面出现异常：'+(ev.message||'未知错误')+'（操作未完成）','warn'); }catch(e2){}
  ev.preventDefault();
});
document.addEventListener('click', function(e){
  var target = e.target;
  var inModal = !!target.closest('.modal');
  if (inModal){
    var el = target.closest('[data-action]');
    if (el && el.closest('.modal')) handleAction(el, e);
    return;
  }
  var el2 = target.closest('[data-action]');
  if (el2) handleAction(el2, e);
  else if (target.closest('[data-nav]')){
    var navEl = target.closest('[data-nav]');
    var navId = navEl.getAttribute('data-pid');
    if (navId) openPostDetail(navId);
  }
  else {
    var tabEl = target.closest('[data-tab]');
    if (tabEl){
      if (tabEl.closest('#tabbar')){
        view.tab = tabEl.getAttribute('data-tab');
        render();
      } else {
        view.tab = tabEl.getAttribute('data-tab'); render();
      }
    }
    else if (target.classList && target.classList.contains('modal-mask') && !target.classList.contains('rk-noclose')) closeModal();
  }
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id==='redeem-inp'){
    var v = parseInt(e.target.value,10);
    var hEl = document.getElementById('redeem-hint');
    if (hEl){
      var q = HabitEngine.redeemQuote(isNaN(v)?0:v, state.exchangeRate);
      hEl.innerHTML = '每 <b>'+q.rm+' 分钟</b> = <b>¥'+q.ry+'</b>，比例可自行调整。当前输入可兑换 <b>¥'+q.yuan+'</b>（'+q.minutes+' 分钟）。'+(q.minutes>state.account.balanceMin?'<span style="color:var(--danger)">余额不足！</span>':'');
    }
  }
  if (e.target && e.target.id==='use-inp'){
    var u = parseInt(e.target.value,10);
    var hEl2 = document.getElementById('use-hint');
    if (hEl2){
      var val = isNaN(u)?0:u;
      hEl2.innerHTML = '直接从余额中扣除对应分钟。当前输入 <b>'+val+' 分钟</b>。'+(val>state.account.balanceMin?'<span style="color:var(--danger)">余额不足！</span>':'');
    }
  }
});
/* v3.7.0：私信输入框 Enter 发送，Shift+Enter 换行 */
document.addEventListener('keydown', function(e){
  if (e.target && e.target.id === 'chat-input-ta'){
    if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing){
      e.preventDefault();
      sendDm();
    }
  }
});
document.addEventListener('change', function(e){
  if (e.target && e.target.id==='import-file') importDataFile(e.target.files[0]);
  if (e.target && e.target.id==='f-boost'){
    var ba = document.getElementById('boost-area');
    if (ba) ba.style.display = e.target.checked ? 'grid' : 'none';
  }
  if (e.target && e.target.id==='pf-file'){
    pendingAvatarFile = e.target.files && e.target.files[0] ? e.target.files[0] : null;
    var pv = document.getElementById('pf-preview');
    if (pv){
      if (pendingAvatarFile){
        pv.src = URL.createObjectURL(pendingAvatarFile);
        pv.style.display = 'block';
        toast('已选择头像：' + pendingAvatarFile.name);
      } else {
        pv.style.display = 'none';
      }
    }
  }
  if (e.target && e.target.id==='rg-file'){
    regCustomFile = e.target.files && e.target.files[0] ? e.target.files[0] : null;
    var up = document.getElementById('rg-ava-up');
    if (up){
      if (regCustomFile){
        up.classList.add('sel');
        up.innerHTML = '<img id="rg-ava-up-img" alt="已选头像" src="' + URL.createObjectURL(regCustomFile) + '">';
        toast('已选择头像：' + regCustomFile.name);
      } else {
        up.classList.remove('sel');
        up.innerHTML = '<span class="rk-up-plus">+</span><span class="rk-up-txt">上传头像</span>';
      }
    }
  }
});

/* ==== 初始化（鉴权门禁 + 主应用启动） ==== */
function bootApp(){
  var firstRun = false;
  try{ firstRun = localStorage.getItem(Store.KEY)==null; }catch(e){ firstRun = true; }
  state = Store.load();
  ensureAppBirth();
  autoSettle();
  render();
  if (firstRun) setTimeout(function(){ toast('欢迎使用！已预置「扔垃圾」「阅读」考核项，规则可在「考核项」页调整。','good'); }, 600);
  /* NAS 数据同步：服务器有数据则以其为准；服务器无数据且本机已有记录时推送上去 */
  Sync.load(function(err, server){
    if (!err && server){
      var srv = normalize(JSON.parse(JSON.stringify(server.data)));
      if (JSON.stringify(state) !== JSON.stringify(srv)){
        state = srv;
        ensureAppBirth();
        try{ localStorage.setItem(Store.KEY, JSON.stringify(state)); }catch(e){}
        autoSettle();
        render();
        toast('已加载 NAS 云端数据', 'good');
      }
    } else if (err && err.err === 'empty' && !firstRun){
      Sync.push();  /* 云端无数据，把本机记录建立到云端 */
    }
    /* 其他错误：服务器不可达，保持本地模式，下次操作自动重试同步 */
  });
}
(function init(){
  Auth.load();
  if (!Auth.token){ showAuthView(); return; }
  /* 有 token → 校验会话有效性 */
  postJSON('kaohe-api/auth.php?action=check', { token: Auth.token })
    .then(function(res){
      if (res.status === 401 || !(res.json && res.json.ok && res.json.user)){
        Auth.clear();
        showAuthView();
        return;
      }
      Auth.user = res.json.user;
      try{ localStorage.setItem('kaohe_user', JSON.stringify(Auth.user)); }catch(e){}
      document.getElementById('auth-root').style.display = 'none';
      document.getElementById('app').style.display = '';
      var tb0 = document.getElementById('tabbar'); if (tb0) tb0.style.display = '';
      renderUserChip();
      bootApp();
      /* v3.7.0：登录后立即拉一次未读徽标，并每 30s 轮询 */
      refreshUnreadBadge();
      setInterval(refreshUnreadBadge, 30000);
    }).catch(function(){
      /* 网络不可达：保留 token，引导用户稍后重试 */
      toast('无法连接服务器，请检查网络后刷新页面', 'warn');
      showAuthView();
    });
})();
</script>
