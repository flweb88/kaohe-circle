<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考核小管家</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D7CF2'/%3E%3Cpath d='M10 19l4 4 8-9' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --primary:#1D7CF2; --primary-soft:#E8F1FE; --primary-deep:#1560C9;
  --success:#16A34A; --success-soft:#E9F9EF;
  --danger:#DC2626; --danger-soft:#FDECEC;
  --gold:#1D7CF2; --gold-soft:#E8F1FE;
  --bg:#F6F7F9; --card:#FFFFFF; --border:#E8EAF0;
  --text:#23262F; --muted:#757B8A;
  --radius:16px; --shadow:0 2px 10px rgba(30,34,50,.05);
  --accent:#1D7CF2;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
#app{max-width:880px;margin:0 auto;padding:12px 16px 92px}
/* ===== 顶栏 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 2px 14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#1D7CF2,#5AA0F8);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(29,124,242,.28)}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:12px;color:var(--muted);margin-top:1px}
.balance-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;white-space:nowrap;flex:none}
.balance-chip:hover{transform:translateY(-1px)}
.balance-chip .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.balance-chip .lbl{font-size:12px;color:var(--muted)}
.balance-chip .val{font-weight:700;font-size:15px}
.balance-chip .yuan{font-size:12px;color:var(--gold);font-weight:600}
footer{text-align:center;font-size:11px;color:var(--muted);margin-top:24px;padding-top:12px;border-top:1px dashed var(--border);user-select:none}
/* ===== 导航 ===== */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:20}
.tab{flex:1;padding:10px 0;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);transition:all .18s;text-align:center}
.tab:hover{color:var(--text)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 3px 8px rgba(29,124,242,.3)}
/* ===== 主区 ===== */
main{margin-top:18px}
.view-title{font-size:16px;font-weight:700;margin:6px 2px 12px;display:flex;align-items:center;justify-content:space-between}
.view-title .tip{font-size:12.5px;color:var(--muted);font-weight:400}
.grp-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:16px 2px 10px}
.grp-title::before{content:'';width:4px;height:16px;border-radius:2px;flex:none}
.grp-title.grp-rw::before{background:var(--success)}
.grp-title.grp-pn::before{background:var(--gold)}
.grp-title .cnt{font-size:12px;color:var(--muted);font-weight:400}
/* 今日概览卡 */
.today-hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-date{display:flex;flex-direction:column;gap:2px}
.hero-date .d1{font-size:17px;font-weight:700}
.hero-date .d2{font-size:12.5px;color:var(--muted)}
.hero-stats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.hstat .n{font-size:20px;font-weight:800}
.hstat .l{font-size:12px;color:var(--muted)}
.hstat .n.done{color:var(--success)}
.hstat .n.pending{color:var(--primary)}
.hstat .n .u{font-size:14px;font-weight:700;opacity:.55}
/* 考核卡 */
.habit-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.habit-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.h-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.h-ico svg{width:22px;height:22px}
.h-name{font-size:16px;font-weight:700}
.h-rule{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;cursor:pointer}
.h-rule.expanded{display:block;-webkit-line-clamp:none;-webkit-box-orient:initial;overflow:visible}
.h-rule-more{display:inline-block;font-size:12px;color:var(--accent);cursor:pointer;margin-top:3px;font-weight:600}
.h-progress{flex:1;min-width:110px;margin:0 6px}
.hp-bar{height:8px;border-radius:5px;background:#EEF0F4;overflow:hidden;margin-top:6px}
.hp-fill{height:100%;border-radius:5px;transition:width .4s}
.hp-nums{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}
.h-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;font-weight:600;font-size:14px;padding:9px 16px;transition:all .15s;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 3px 8px rgba(29,124,242,.28)}
.btn-primary:hover{background:#1560C9}
.btn-ghost{background:#F1F2F6;color:var(--text)}
.btn-ghost:hover{background:#E9EAF0}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#128A3C}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:#FADADA}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn[disabled]:active{transform:none}
.h-done-line{display:flex;align-items:center;gap:7px;color:var(--success);font-weight:600;font-size:14px}
.h-done-line .mins{color:var(--muted);font-weight:400;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill-success{background:var(--success-soft);color:var(--success)}
.pill-none{background:#F1F2F6;color:var(--muted)}
.pill-warn{background:var(--gold-soft);color:var(--gold)}
.under-min{border:1.5px dashed #8FB8F5 !important}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .t{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
/* 考核项页 */
.rule-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.rule-box .r-line{display:flex;gap:10px;font-size:13.5px;padding:5px 0;color:var(--text)}
.rule-box .r-line svg{flex:none;margin-top:2px}
.rule-box .r-line .k{color:var(--muted);width:88px;flex:none}
.habit-mgmt{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.mgmt-btn{padding:6px 12px;font-size:12.5px;border-radius:9px;font-weight:600}
/* 账户页 */
.acct-hero{background:linear-gradient(135deg,#1D7CF2,#1560C9);border-radius:var(--radius);padding:22px;color:#fff;box-shadow:0 8px 20px rgba(29,124,242,.25);margin-bottom:14px}
.acct-hero .lab{font-size:13px;opacity:.9}
.acct-hero .big{font-size:44px;font-weight:800;line-height:1.15;margin:4px 0 2px}
.acct-hero .sub{font-size:13px;opacity:.92}
.acct-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.acct-stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;text-align:center;box-shadow:var(--shadow)}
.acct-stat .n{font-size:19px;font-weight:800}
.acct-stat .n.g{color:var(--success)}
.acct-stat .n.o{color:var(--primary)}
.acct-stat .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.redeem-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.redeem-opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.redeem-opt .inp{flex:1;min-width:150px;padding:11px 14px;border:1.5px solid var(--border);border-radius:11px;outline:none;background:#FBFCFF}
.redeem-opt .inp:focus{border-color:var(--gold)}
.redeem-hint{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}
.redeem-hint b{color:var(--gold)}
/* 兑换比例行 */
.rate-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#F8F9FB;border:1px solid var(--border);border-radius:11px;padding:9px 12px;margin-bottom:12px}
.rate-row .rate-lab{font-size:12.5px;font-weight:600;color:var(--muted);margin-right:2px;white-space:nowrap}
.rate-row .rate-inp{width:76px;padding:7px 9px;border:1.5px solid var(--border);border-radius:9px;outline:none;background:#fff;font-size:15px}
.rate-row .rate-inp:focus{border-color:var(--gold)}
.rate-row .rate-eq{font-size:13px;color:var(--text);font-weight:600;white-space:nowrap}
/* 记录 */
.rec-group{margin-bottom:6px}
.rec-day{font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 2px 6px;display:flex;align-items:center;gap:8px}
.rec-day::after{content:"";flex:1;height:1px;background:var(--border)}
.rec-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.rec-item .info{flex:1;min-width:0}
.rec-item .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.rec-item .dt{font-size:12px;color:var(--muted);margin-top:1px}
.rec-item .val{font-weight:700;font-size:14px;white-space:nowrap}
.rec-item .val.plus{color:var(--success)}
.rec-item .val.minus{color:var(--danger)}
.rec-item .val.zero{color:var(--muted)}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;display:inline-block;vertical-align:middle}
.tag-boost{background:var(--gold-soft);color:var(--gold)}
.tag-none{background:#F1F2F6;color:var(--muted)}
.tag-full{background:var(--success-soft);color:var(--success)}
.tag-r{background:var(--primary-soft);color:var(--primary)}
/* 模态 */
.modal-mask{position:fixed;inset:0;background:rgba(20,23,35,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px;animation:fade .18s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.2);animation:pop .2s}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:4px}
.modal .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld label .req{color:var(--danger)}
.fld input[type=text],.fld input[type=password],.fld input[type=email],.fld input[type=number],.fld input[type=date],.fld textarea,.fld select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;outline:none;background:#FBFCFF}
.fld input:focus,.fld select:focus{border-color:var(--primary)}
.fld .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.ico-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.ico-pick .ip{width:38px;height:38px;border-radius:10px;background:#F3F4F7;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent}
.ico-pick .ip svg{width:20px;height:20px}
.ico-pick .ip:hover{background:#E8F1FE}
.ico-pick .ip.sel{border-color:var(--primary);background:var(--primary-soft)}
.color-pick{display:flex;gap:8px;flex-wrap:wrap}
.color-pick .cp{width:26px;height:26px;border-radius:8px;cursor:pointer;border:3px solid transparent}
.color-pick .cp.sel{border-color:#fff;box-shadow:0 0 0 2px var(--text)}
.switch{display:flex;align-items:center;cursor:pointer;user-select:none;min-height:26px;position:relative}
.switch input{position:absolute;opacity:0;pointer-events:none;width:0;height:0;margin:0}
.switch .trk{display:inline-block;width:40px;height:23px;border-radius:12px;background:#D7DAE2;position:relative;transition:background .18s;flex:0 0 40px;margin-right:10px}
.switch .trk::after{content:"";position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s}
.switch input:checked + .trk{background:var(--primary)}
.switch input:checked + .trk::after{left:19px}
.switch .sw-lbl{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.5;color:var(--text);display:inline}
.modal-ft{display:flex;gap:10px;margin-top:18px}
.modal-ft .btn{flex:1}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 考核类型选择 */
.type-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-pick .tp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:12px;border:2px solid var(--border);background:#FBFCFF;color:var(--text);font-weight:700;font-size:14px;transition:all .15s;text-align:center}
.type-pick .tp:hover{border-color:var(--primary)}
.type-pick .tp.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 3px 10px rgba(29,124,242,.15)}
.type-pick .tp .tp-sub{font-size:11.5px;color:var(--muted);font-weight:400;line-height:1.4}
.type-pick .tp.sel .tp-sub{color:var(--primary)}
/* 提示 */
#toast-root{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#23262F;color:#fff;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:toastIn .22s;display:flex;align-items:center;gap:9px;max-width:88vw}
.toast.good{background:var(--success)}
.toast.warn{background:var(--gold)}
.toast .ic{font-size:15px}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}}
/* 横幅 */
.banner{background:var(--gold-soft);border:1px solid #C9DDF8;color:#1560C9;border-radius:12px;padding:11px 15px;font-size:13px;margin-bottom:14px;line-height:1.6}
/* 导出导入 */
.data-ops{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
/* ===== 登录门禁 ===== */
#auth-root{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:400px;padding:28px 24px}
.auth-brand{text-align:center;margin-bottom:18px}
.auth-brand .logo{margin:0 auto 10px;width:52px;height:52px;border-radius:15px}
.auth-brand h2{font-size:20px;font-weight:800;letter-spacing:.3px}
.auth-brand p{font-size:12.5px;color:var(--muted);margin-top:3px}
.auth-tabs{display:flex;background:#F1F2F6;border-radius:12px;padding:4px;margin-bottom:16px;gap:4px}
.auth-tab{flex:1;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:9px;text-align:center;transition:all .15s}
.auth-tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(29,124,242,.3)}
.auth-err{background:var(--danger-soft);color:var(--danger);font-size:13px;border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.auth-ok{background:var(--success-soft);color:var(--success);font-size:13px;border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.captcha-row{display:flex;gap:8px;align-items:center}
.captcha-row .cq{flex:1;padding:10px 12px;background:#F8F9FB;border:1.5px solid var(--border);border-radius:10px;font-weight:700;font-size:14px;letter-spacing:1px}
/* 生肖头像宫格 */
.zodiac-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.zodiac-grid .zg{border:2px solid var(--border);border-radius:12px;padding:6px 2px;text-align:center;cursor:pointer;background:#FBFCFF;transition:all .12s}
.zodiac-grid .zg:hover{border-color:var(--primary)}
.zodiac-grid .zg img{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#F1F2F6;display:block;margin:0 auto}
.zodiac-grid .zg span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.zodiac-grid .zg.sel{border-color:var(--primary);background:var(--primary-soft)}
/* ===== 顶栏用户胶囊 ===== */
.topbar-right{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:7px 10px;box-shadow:var(--shadow)}
.u-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#F1F2F6;flex:none}
.u-nick{font-size:13px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-btn{font-size:12.5px;font-weight:600;color:var(--muted);padding:4px 9px;border-radius:8px;white-space:nowrap}
.u-btn:hover{background:#F1F2F6;color:var(--text)}
.u-btn.u-logout{color:var(--danger)}
.u-btn.u-logout:hover{background:var(--danger-soft)}
/* 管理员面板 */
.adm-user{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.adm-user .ai{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#F1F2F6;flex:none}
.adm-user .ainfo{flex:1;min-width:130px}
.adm-user .anm{font-weight:600;font-size:13.5px}
.adm-user .aem{font-size:12px;color:var(--muted);word-break:break-all}
.adm-user .abt{font-size:12px;padding:4px 9px;border-radius:8px}
footer .fb-link{font-size:11px;color:var(--primary);font-weight:600;margin-left:6px}
footer .fb-link:hover{text-decoration:underline}
/* 响应式 */
@media(max-width:640px){
  body{font-size:16px}
  #toast-root{top:auto;bottom:20px}
  .brand{min-width:0;flex:1}
  .brand > div{min-width:0}
  .brand h1{white-space:nowrap;font-size:17px}
  .brand .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;margin-top:1px}
  .balance-chip{padding:8px 11px;gap:6px}
  .tabs{top:8px}
  .tab{padding:12px 0;font-size:15px}
  .hero-stats{gap:14px;margin-left:0;width:100%;padding-top:10px;border-top:1px dashed var(--border)}
  .h-progress{flex:1 1 100%;min-width:0;margin:10px 0 0;order:9}
  .h-actions .btn{font-size:13.5px;padding:10px 14px;min-width:64px;min-height:44px}
  .btn-block{min-height:44px}
  .h-rule{font-size:14px}
  .hp-nums{font-size:14px}
  .hero-date .d2{font-size:14px}
  .hstat .l{font-size:14px}
  .brand .sub{font-size:14px}
  .balance-chip .lbl,.balance-chip .yuan{font-size:14px}
  .view-title .tip{font-size:14px}
  .tag{font-size:14px}
  .acct-hero .big{font-size:36px}
  .acct-stats{grid-template-columns:repeat(2,1fr)}
  .fld-row{grid-template-columns:1fr}
  .ico-pick{grid-template-columns:repeat(7,1fr)}
  .u-nick{display:none}
  .user-chip{padding:6px 8px;gap:6px}
  .topbar-right{gap:6px}
  .auth-card{padding:22px 18px}
  .zodiac-grid{grid-template-columns:repeat(4,1fr)}
}

/* ===== 考核圈：底部 tabbar ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--border);display:flex;max-width:880px;margin:0 auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.tabbar .tb svg{width:22px;height:22px;fill:none;stroke:currentColor}
.tabbar .tb.active{color:var(--primary)}
.tabbar .tb.active svg{fill:currentColor;stroke:none}
.tabbar .tb .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center;display:none}
.tabbar .tb .badge.on{display:block}

/* ===== 考核圈：动态流 ===== */
.feed-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:6px}
.feed-tabs .ft{flex:1;text-align:center;padding:12px 0;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.feed-tabs .ft.active{color:var(--text)}
.feed-tabs .ft.active::after{content:'';position:absolute;left:30%;right:30%;bottom:-1px;height:3px;border-radius:2px;background:var(--primary)}
.post{padding:14px 2px;border-bottom:1px solid var(--border)}
.post-head{display:flex;gap:10px;align-items:flex-start}
.post-head .pa{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#F1F2F6;flex:none}
.post-head .pmeta{flex:1;min-width:0}
.post-head .pname{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px}
.post-head .psub{font-size:12px;color:var(--muted);margin-top:1px}
.post-head .pbook{flex:none;color:var(--muted);padding:4px;cursor:pointer}
.post-head .pbook.on{color:var(--primary)}
.post-text{margin-top:8px;font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.post-text .mention{color:var(--primary);font-weight:600}
.post-score{margin-top:10px;background:var(--success-soft);border:1px solid #CBEAD6;border-radius:12px;padding:12px 14px}
.post-score .ps-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.post-score .ps-name{font-weight:700;font-size:14px;color:#14532D}
.post-score .ps-rw{font-size:18px;font-weight:800;color:var(--gold)}
.post-score .ps-row{font-size:12.5px;color:#166534;margin-top:6px}
.post-score .ps-bar{height:6px;border-radius:3px;background:#CBEAD6;margin-top:8px;overflow:hidden}
.post-score .ps-bar > i{display:block;height:100%;background:var(--success);border-radius:3px}
.post-score .ps-foot{font-size:11px;color:var(--muted);margin-top:8px}
.post-actions{display:flex;gap:18px;margin-top:10px;color:var(--muted);font-size:13px}
.post-actions .pa-item{display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px}
.post-actions .pa-item svg{width:17px;height:17px}
.post-actions .pa-item.on{color:var(--primary)}
.fab{position:fixed;right:max(16px,calc(50% - 440px + 16px));bottom:96px;width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(29,124,242,.4);z-index:25;cursor:pointer}
.fab svg{width:26px;height:26px}
/* ===== v3.8.0 首页「我的主页」子页 ===== */
/* 嵌入容器：底部留白，保证最后一条帖子的互动条不被固定发帖胶囊遮挡 */
.my-profile-embed{padding-bottom:40px}
/* 固定发帖胶囊：位于底部 tabbar 正上方，仅「我的主页」子页出现；z-index 在内容之上、弹窗(100)之下 */
.my-compose-fab{position:fixed;right:max(16px,calc(50% - 440px + 16px));bottom:calc(68px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:6px;padding:12px 22px;border:none;border-radius:999px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;line-height:1;box-shadow:0 6px 18px rgba(29,124,242,.4);cursor:pointer}
.my-compose-fab:hover{background:var(--primary-deep)}
.my-compose-fab svg{width:18px;height:18px;flex:none}
.ptr-ind{text-align:center;font-size:12px;color:var(--muted);padding:10px;display:none}
.ptr-ind.on{display:block}

/* ===== 发布弹窗 ===== */
.compose-toolbar{display:flex;gap:18px;padding:10px 0;border-top:1px solid var(--border);margin-top:10px;color:var(--muted)}
.compose-toolbar .ti{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer}
.compose-toolbar .ti svg{width:22px;height:22px}
.tag-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag-chips .chip{background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.tag-chips .chip .x{cursor:pointer;font-weight:700;opacity:.7}
.tag-chips .chip-add{background:#F1F2F6;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}

/* ===== 私信 ===== */
.dm-thread{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:320px}
.dm-msgs{flex:1;overflow-y:auto;padding:10px 2px;display:flex;flex-direction:column;gap:10px}
.dm-row{display:flex;max-width:78%}
.dm-row.me{align-self:flex-end;flex-direction:row-reverse}
.dm-bubble{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.dm-row.other .dm-bubble{background:#F1F2F6;color:var(--text);border-bottom-left-radius:4px}
.dm-row.me .dm-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.dm-time{text-align:center;font-size:11px;color:var(--muted);margin:4px 0}
.dm-input{display:flex;gap:8px;margin-top:10px}
.dm-input input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:11px;background:#FBFCFF}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;margin-left:6px}

/* ===== 我的 / 列表 ===== */
.me-card{background:linear-gradient(135deg,var(--primary),var(--primary-deep));border-radius:var(--radius);padding:22px;color:#fff;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.me-card img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
.me-card .mn{font-size:20px;font-weight:800}
.me-card .ma{font-size:12.5px;opacity:.9;margin-top:2px}
.seg-tabs{display:flex;background:#F1F2F6;border-radius:11px;padding:4px;gap:4px;margin-bottom:12px}
.seg-tabs .st{flex:1;text-align:center;padding:8px 0;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer}
.seg-tabs .st.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.06)}
/* 我的页：账号设置菜单行 */
.me-menu{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.me-menu .mm-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.me-menu .mm-row:last-child{border-bottom:none}
.me-menu .mm-row:hover{background:#F8F9FC}
.me-menu .mm-ico{width:34px;height:34px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.me-menu .mm-ico svg{width:18px;height:18px}
.me-menu .mm-body{flex:1;min-width:0}
.me-menu .mm-t{font-size:14.5px;font-weight:600}
.me-menu .mm-s{font-size:12px;color:var(--muted);margin-top:1px}
.me-menu .mm-arrow{color:var(--muted);flex:none}
.me-menu .mm-arrow svg{width:16px;height:16px}
.me-menu .mm-row.danger .mm-t{color:var(--danger)}
.me-menu .mm-row.danger .mm-ico{background:var(--danger-soft);color:var(--danger)}
.me-menu .mm-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#F1F2F6;flex:none}
.friend-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.friend-row img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#F1F2F6}
.friend-row .fr-info{flex:1;min-width:0}
.friend-row .fr-n{font-weight:600;font-size:14px}
.friend-row .fr-a{font-size:12px;color:var(--muted)}
.convo-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.convo-row img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#F1F2F6;flex:none}
.convo-row .cv-info{flex:1;min-width:0}
.convo-row .cv-n{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px}
.convo-row .cv-p{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo-row .cv-right{text-align:right;flex:none}
.convo-row .cv-t{font-size:11px;color:var(--muted)}
.convo-row .cv-u{display:inline-block;min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;line-height:19px;margin-top:4px}
.notify-row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
.notify-row.unread{background:var(--primary-soft)}
.notify-row .ni{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.notify-row .nt{flex:1;font-size:13.5px;line-height:1.5}
.notify-row .nt b{font-weight:700}
.notify-row .nr-t{font-size:11px;color:var(--muted);margin-top:2px}

/* 注册页：管理员推荐卡 */
.staff-card{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--primary);border-radius:14px;padding:12px;margin:12px 0}
.staff-card img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#F1F2F6}
.staff-card .sc-info{flex:1;min-width:0}
.staff-card .sc-n{font-weight:700;font-size:14.5px}
.staff-card .sc-tag{display:inline-block;font-size:10.5px;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
.staff-card .sc-sub{font-size:12px;color:var(--muted);margin-top:2px}
.agree-line{text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px}
.share-mini{font-size:12px;color:var(--primary);font-weight:600;padding:4px 8px;cursor:pointer;border-radius:8px}
.share-mini:hover{background:var(--primary-soft)}
/* ===== 考核圈社交版 · 登录/注册/弹窗 ===== */
#auth-root{background:#F5F6F7;align-items:flex-start;overflow-y:auto;padding:44px 20px 64px}
.rk-wrap{width:100%;max-width:420px;margin:0 auto}
.rk-brand{text-align:center;margin-bottom:24px}
.rk-logo{width:78px;height:78px;border-radius:50%;background:linear-gradient(160deg,#3DD68C,#22B45E);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 22px rgba(34,180,94,.28)}
.rk-logo svg{width:48px;height:48px}
.rk-brand h2{font-size:27px;font-weight:800;letter-spacing:2px;color:#1C1F26}
.rk-brand p{font-size:14px;color:#8A8F9C;margin-top:7px;letter-spacing:.5px}
.rk-card{background:#fff;border-radius:24px;padding:26px 26px 24px;box-shadow:0 8px 28px rgba(30,34,50,.07)}
.rk-field{display:flex;align-items:center;gap:12px;border-bottom:1px solid #EDEEF1;padding:13px 2px}
.rk-field .rk-fi{width:22px;height:22px;flex:none;color:#B9BEC9;display:flex;align-items:center}
.rk-field .rk-fi svg{width:21px;height:21px}
.rk-field input{flex:1;border:none;outline:none;background:transparent;font-size:16px;color:#23262F;min-width:0;padding:0}
.rk-field input::placeholder{color:#B9BEC9}
.rk-field:focus-within{border-bottom-color:#1D7CF2}
.rk-eye{flex:none;color:#B9BEC9;display:flex;align-items:center;padding:4px}
.rk-eye svg{width:21px;height:21px}
.rk-eye:hover{color:#7A8090}
.rk-forgot{text-align:right;margin:14px 2px 20px}
.rk-forgot button{color:#1D7CF2;font-size:14px;font-weight:500}
.rk-btn-blue{width:100%;background:#1D7CF2;color:#fff;border-radius:999px;padding:14px;font-size:16px;font-weight:600;box-shadow:0 8px 18px rgba(29,124,242,.28);transition:transform .12s}
.rk-btn-blue:active{transform:scale(.98)}
.rk-btn-gray{background:#EEF0F4;color:#5A6070;border-radius:999px;padding:14px;font-size:16px;font-weight:600}
.rk-switch{text-align:center;margin-top:20px;font-size:14px;color:#8A8F9C}
.rk-switch button{color:#1D7CF2;font-weight:600;font-size:14px}
.rk-ver{text-align:center;font-size:11px;color:#B6BBC6;margin-top:14px;letter-spacing:.3px}
.rk-cq{display:inline-block;background:#E8F1FE;color:#1D7CF2;font-weight:700;padding:9px 16px;border-radius:12px;font-size:15px;letter-spacing:1px;flex:none}
.rk-captcha-foot{display:flex;align-items:center;gap:10px;margin:10px 2px 2px}
.rk-refresh{color:#1D7CF2;font-size:12.5px;font-weight:600;margin-left:auto}
.rk-ava-label{font-size:14px;font-weight:600;color:#5A6070;margin:18px 0 12px}
.rk-ava-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:8px}
.rk-ava{aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;position:relative;background:#F4F5F8;transition:all .12s}
.rk-ava img{width:100%;height:100%;object-fit:cover}
.rk-ava:hover{border-color:#C9DDF8}
.rk-ava.sel{border-color:#1D7CF2}
.rk-ava-up{flex-direction:column;border:1.5px dashed #C6CBD6;background:#FAFBFD}
.rk-ava-up.sel{border-color:#1D7CF2;border-style:solid}
.rk-up-plus{font-size:20px;color:#9AA0AE;line-height:1;font-weight:300}
.rk-up-txt{font-size:10px;color:#9AA0AE;margin-top:2px}
/* 注册成功弹窗 */
.rk-done-wrap{text-align:center;padding:12px 4px 4px}
.rk-done-check{width:74px;height:74px;border-radius:50%;background:linear-gradient(160deg,#3DD68C,#22B45E);margin:6px auto 18px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(34,180,94,.3)}
.rk-done-check svg{width:38px;height:38px}
.rk-done-title{font-size:22px;font-weight:800;color:#1C1F26;letter-spacing:1px}
.rk-done-sub{font-size:14px;color:#8A8F9C;margin-top:8px;margin-bottom:24px}
.rk-done-btns{display:flex;gap:12px}
.rk-done-btns .rk-btn-gray,.rk-done-btns .rk-btn-blue{flex:1;padding:13px;font-size:15px}
/* 忘记密码弹窗 */
.rk-fg-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:6px;color:#1C1F26}
.rk-fg-sub{font-size:13px;color:#8A8F9C;text-align:center;margin-bottom:16px;line-height:1.6}
.rk-fg-msg{font-size:13px;border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.rk-fg-msg.err{background:#FDECEC;color:#DC2626}
.rk-fg-msg.ok{background:#E9F9EF;color:#16A34A}
.rk-fg-back{text-align:center;margin-top:14px}
.rk-fg-back button{font-size:13px;color:#8A8F9C;font-weight:500}
@media(max-width:480px){
  #auth-root{padding:30px 16px 48px}
  .rk-card{padding:22px 20px;border-radius:20px}
  .rk-brand h2{font-size:24px}
  .rk-ava-grid{gap:8px}
}

/* ===== MVP-5 动态页新增样式 ===== */
.compose-entry{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer}
.compose-entry .ce-ava{width:36px;height:36px;border-radius:50%;background:#F1F2F6;flex:none;object-fit:cover}
.compose-entry .ce-ph{flex:1;color:var(--muted);font-size:14px}
.compose-entry .ce-btn{flex:none}
.feed-tabs{position:relative}
.feed-refresh{position:absolute;right:4px;top:8px;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px}
.feed-refresh:hover{color:var(--primary);background:var(--primary-soft)}
.feed-loading{padding:48px 20px;text-align:center;color:var(--muted)}
.feed-end{padding:20px;text-align:center;color:var(--muted);font-size:12.5px}
.feed-more{padding:10px 0 20px}
.rp-tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--muted);background:#F1F2F6;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.post-actions .pa-item i{font-style:normal;margin-left:2px;font-size:12px}
.post-actions .pa-item.on.liked{color:var(--danger)}
.post-media{display:grid;gap:6px;margin-top:8px}
.post-media.cols-1{grid-template-columns:1fr}
.post-media.cols-2{grid-template-columns:1fr 1fr}
.post-media.cols-3{grid-template-columns:1fr 1fr 1fr}
/* v3.5.4：媒体统一规格——图片/视频封面同规格 4:3 + 不超过手机半屏；多图 grid 单元格一致 */
.media-cell{position:relative;border-radius:10px;overflow:hidden;background:#F1F2F6;aspect-ratio:4/3;max-height:40vh;cursor:zoom-in}
.media-cell img,.media-cell video{width:100%;height:100%;object-fit:cover;display:block;max-height:40vh}
.media-cell.audio-cell{aspect-ratio:auto;max-height:none;cursor:default}
.media-cell.audio-cell audio{width:100%;display:block;border-radius:10px}
.media-cell .media-dl{position:absolute;right:6px;top:6px;z-index:3;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;text-decoration:none}
/* 引用块（原帖转发 / 评论转发） */
.post-quote{margin-top:8px;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--bg,#fff)}
.post-quote .pq-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;color:var(--muted)}
.post-quote .pq-head img{width:18px;height:18px;border-radius:50%}
.post-quote .pq-text{font-size:13.5px;color:var(--text);word-break:break-word}
.post-quote .pq-deleted{font-size:13px;color:var(--muted);padding:6px 0}
.media-ph{padding:22px;text-align:center;color:var(--muted);font-size:13px;background:#F6F7F9;border-radius:10px}
.media-ph.fail{color:var(--danger);background:var(--danger-soft)}
.media-ph .mp-ic{display:block;font-size:20px;margin-bottom:4px}
.cmt-list{margin:8px 0;max-height:260px;overflow-y:auto}
.cmt-item{padding:9px 4px;font-size:13.5px;border-top:1px dashed var(--border)}
.cmt-item b{color:var(--text)}
.cmt-head{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.cmt-head img.cmt-ava{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.cmt-head .cmt-who{flex:1;min-width:0}
.cmt-head .cmt-nick{font-weight:600;font-size:13.5px;color:var(--text);line-height:1.3}
.cmt-head .cmt-time{font-size:11.5px;color:var(--muted)}
.cmt-body{word-break:break-word;color:var(--text)}
.cmt-body .cmt-reply-tag{color:var(--primary);font-size:12.5px}
.cmt-acts{display:flex;gap:12px;margin-top:5px;color:var(--muted);font-size:12px}
.cmt-acts .ca{cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:2px 0}
.cmt-acts .ca.on{color:var(--primary)}
.cmt-acts .ca.on.liked{color:var(--danger)}
.cmt-acts .ca i{font-style:normal}
.cmt-media{display:grid;gap:6px;margin-top:6px}
.cmt-media.cols-1{grid-template-columns:1fr}
.cmt-media.cols-2{grid-template-columns:1fr 1fr}
.cmt-media.cols-3{grid-template-columns:1fr 1fr 1fr}
.cmt-replies{margin-top:4px;padding-left:36px;border-left:2px solid var(--border)}

/* ==== 核心引擎（纯函数，可独立测试） ==== */
var HabitEngine = (function(){
  var MS = 86400000;
  function parse(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return fmt(d); }
  function today(){ var d=new Date(); return fmt(d); }
  function diffDays(a,b){ return Math.round((parse(b)-parse(a))/MS); }
  // 包含 dateStr 的周期起点
  function cycleStart(anchor, cycleDays, dateStr){
    var d = diffDays(anchor, dateStr);
    var k = Math.floor(d / cycleDays);
    return addDays(anchor, k*cycleDays);
  }
  function cycle(anchor, cycleDays, dateStr){
    var start = cycleStart(anchor, cycleDays, dateStr);
    return { start: start, end: addDays(start, cycleDays-1) };
  }
  function inCycle(cyc, dateStr){ return dateStr >= cyc.start && dateStr <= cyc.end; }
  function isDone(habit, checkin, minMinutes){
    if (checkin == null) return false;
    if (habit.minMinutes > 0) return checkin.minutes != null && checkin.minutes >= habit.minMinutes;
    return true;
  }
  function checkinsInCycle(checkins, habitId, cyc){
    return checkins.filter(function(c){ return c.habitId===habitId && inCycle(cyc, c.date); });
  }
  // 周期完成统计
  function cycleStats(habit, checkins, cyc){
    var list = checkinsInCycle(checkins, habit.id, cyc);
    var valid = list.filter(function(c){ return isDone(habit, c, 0); });
    var under = list.filter(function(c){ return !isDone(habit, c, 0); });
    return { list:list, count:valid.length, required:habit.requiredCount, underCount:under.length, boostOk: list.length>0 && list.every(function(c){ return c.minutes!=null && c.minutes>=habit.boostThresholdMin; }) };
  }
  // 周期内未达标天数（当天无达标记录；时间型需时长达标才算达标）
  function missDays(habit, checkins, cyc){
    var miss = 0, d = cyc.start;
    while (d <= cyc.end){
      var ok = false;
      for (var i=0;i<checkins.length;i++){
        var c = checkins[i];
        if (c.habitId===habit.id && c.date===d){
          if (habit.type==='time' && habit.minMinutes>0){ if ((c.minutes||0) >= habit.minMinutes) ok = true; }
          else ok = true;
          break;
        }
      }
      if (!ok) miss++;
      d = addDays(d,1);
    }
    return miss;
  }
  // 结算判定（统一净值模型）：
  //   M=周期天数（计时器，周期到自动结算）；N=触发次数（打卡达到 N 次触发）
  //   结算净值 = 触发值 + (打卡次数 - N) × 每档量
  //   触发值正=奖励、负=惩罚；每档量正=超过 N 后每多 1 次多奖、负=多扣、0=无阶梯
  function settle(habit, checkins, cyc){
    var st = cycleStats(habit, checkins, cyc);
    var reward = 0, boost = false, status = 'miss', penalty = 0;
    var N = habit.triggerDays || st.required;
    // 时间型不设惩罚：触发值/每档量取正（负值视为 0，只奖不罚）
    var tval = (habit.type==='time' && habit.triggerValue<0) ? 0 : habit.triggerValue;
    var sval = (habit.type==='time' && habit.stepValue<0) ? 0 : habit.stepValue;
    if (st.count >= N){
      if (habit.boostEnabled && habit.minMinutes > 0 && st.list.length >= N && st.boostOk){
        reward = habit.boostRewardMin; boost = true; status = 'boost';
      } else if (tval !== 0){
        var net = tval + (st.count - N) * sval;
        if (net >= 0){ reward = net; status = 'full'; }
        else { penalty = -net; status = 'pen'; }
      } else {
        status = 'full';
      }
    }
    return { reward:reward, boost:boost, status:status, penalty:penalty, count:st.count, required:st.required, list:st.list, miss:missDays(habit, checkins, cyc) };
  }
  // 当前/上一周期
  function currentCycle(habit, dateStr){ return cycle(habit.anchorDate, habit.cycleDays, dateStr); }
  function prevCycleOf(habit, dateStr){
    var cur = currentCycle(habit, dateStr);
    return cycle(habit.anchorDate, habit.cycleDays, addDays(cur.start,-1));
  }
  // 账户兑换：每30分钟 = 10元
  function redeemQuote(minutes, rate){
    var rm = (rate && rate.minutes > 0) ? rate.minutes : 30;
    var ry = (rate && rate.yuan > 0) ? rate.yuan : 10;
    if (minutes < 0){
      var debt = Math.round(Math.abs(minutes)/rm*ry*100)/100;
      return { minutes: minutes, yuan: -debt, units: 0, debt: true, rm: rm, ry: ry };
    }
    var units = Math.floor(minutes / rm);
    return { minutes: units*rm, yuan: Math.round(units*ry*100)/100, units: units, rm: rm, ry: ry };
  }
  return { parse:parse, fmt:fmt, addDays:addDays, today:today, diffDays:diffDays, cycleStart:cycleStart, cycle:cycle, inCycle:inCycle, isDone:isDone, checkinsInCycle:checkinsInCycle, cycleStats:cycleStats, settle:settle, missDays:missDays, currentCycle:currentCycle, prevCycleOf:prevCycleOf, redeemQuote:redeemQuote };
})();

/* NAS 后端同步：数据权威存 NAS，浏览器 localStorage 仅作离线降级缓存 */
var Sync = {
  base: 'kaohe-api/',
  _queue: null,
  _synced: false,
  load: function(cb){
    if (!Auth.token){ cb({err:'auth'}, null); return; }
    fetch(this.base + 'load.php', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: Auth.token }),
      cache:'no-store'
    }).then(function(r){
      if (r.status === 401){ onAuthExpired(); cb({err:'auth'}, null); return null; }
      return r.json().then(function(j){
        if (j && j.ok && j.data && j.data.habits) cb(null, j);
        else cb(j && j.err ? {err:j.err} : {err:'empty'}, null);
      });
    }).catch(function(e){ cb(e, null); });
  },
  push: function(){
    var self = this;
    if (!this._queue) this._queue = Promise.resolve();
    this._queue = this._queue.then(function(){
      return new Promise(function(res){
        if (!Auth.token){ res(); return; }
        fetch(self.base + 'save.php', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ token: Auth.token, data: state }),
          cache:'no-store'
        }).then(function(r){
          if (r.status === 401){ onAuthExpired(); res(); return; }
          self._synced = true; res();
        }).catch(function(){ self._synced = false; res(); });
      });
    });
    return this._queue;
  }
};

/* ==== 登录态 / 多用户 ==== */
var Auth = {
  token: null,
  user: null,
  load: function(){
    try{
      this.token = localStorage.getItem('kaohe_token');
      var u = localStorage.getItem('kaohe_user');
      this.user = u ? JSON.parse(u) : null;
    }catch(e){ this.token = null; this.user = null; }
  },
  save: function(token, user){
    this.token = token; this.user = user;
    try{
      localStorage.setItem('kaohe_token', token);
      localStorage.setItem('kaohe_user', JSON.stringify(user));
    }catch(e){}
  },
  clear: function(){
    this.token = null; this.user = null;
    try{
      localStorage.removeItem('kaohe_token');
      localStorage.removeItem('kaohe_user');
    }catch(e){}
  }
};

function doLogin(){

  var pwd = document.getElementById('lg-pwd').value || '';

  postJSON('kaohe-api/auth.php?action=login', { email:email, password:pwd })
    .then(function(res){
      if (apiFail(res)) return;
      var j = res.json;
      if (j && j.ok && j.token){ enterApp(j.token, j.user); }
      else showAuthErr(apiMsg(res));
    }).catch(function(){ showAuthErr('网络错误，请稍后重试'); });
}
function doRegister(){
  var email = (document.getElementById('rg-email').value || '').trim().toLowerCase();
  var pwd = document.getElementById('rg-pwd').value || '';
  var pwd2 = document.getElementById('rg-pwd2').value || '';
  var invite = (document.getElementById('rg-invite').value || '').trim();
  var ans = (document.getElementById('rg-captcha-ans').value || '').trim();
  var nick = (document.getElementById('rg-nick').value || '').trim();
  if (!email){ showAuthErr('请填写邮箱'); return; }
  if (!pwd){ showAuthErr('请设置密码'); return; }
  if (pwd !== pwd2){ showAuthErr('两次输入的密码不一致'); return; }
  if (!invite){ showAuthErr('请填写邀请码'); return; }
  if (!ans){ showAuthErr('请填写算术验证码答案'); return; }
  postJSON('kaohe-api/auth.php?action=register', {
    email:email, password:pwd, invite:invite,
    captcha_id:captchaInfo.id, captcha_answer:ans,
    nickname:nick || undefined, avatar:'zodiac:' + regAvatar
  }).then(function(res){
    if (apiFail(res)) return;
    var j = res.json;
    if (j && j.ok && j.token){
      Auth.save(j.token, j.user);
      /* 注册成功拿到 token 后：若用户本地上传了头像，异步上传 avatar.php 并落库（不阻塞弹窗） */
      if (regCustomFile){ uploadRegCustomAvatar(j.token, regCustomFile); regCustomFile = null; }
      regAvatar = 'pig';
      showRegSuccessModal();
    }
    else { showAuthErr(apiMsg(res)); refreshCaptcha(); }
  }).catch(function(){ showAuthErr('网络错误，请稍后重试'); refreshCaptcha(); });
}
/* 注册时上传自定义头像：multipart 到 avatar.php，再 profile.php 落库 */
function uploadRegCustomAvatar(token, file){
  var fd = new FormData();
  fd.append('token', token);
  fd.append('file', file);
  fetch('kaohe-api/avatar.php', { method:'POST', body:fd, cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!(j && j.ok && j.avatar)){ toast(j && j.msg ? j.msg : '头像上传失败，已使用默认头像', 'warn'); return; }
      return postJSON('kaohe-api/profile.php?action=avatar', { token:token, avatar:j.avatar })
        .then(function(r2){
          if (r2.json && r2.json.ok){
            if (Auth.user){
              Auth.user.avatar = j.avatar;
              try{ localStorage.setItem('kaohe_user', JSON.stringify(Auth.user)); }catch(e){}
            }
          }
        });
    }).catch(function(){ toast('头像上传失败，已使用默认头像', 'warn'); });
}

function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function normalize(d){
  d.version = 2;
  d.habits = (d.habits||[]).map(function(h){
    var type = h.type || (h.minMinutes>0 ? 'time' : 'check');
    if (type==='check'){ h.minMinutes = 0; h.boostEnabled = false; h.boostThresholdMin = 60; h.boostRewardMin = 0; }
    // 旧数据迁移到统一触发规则（triggerValue：正=达标奖励，负=未达标惩罚）
    var hasReward = h.baseRewardMin>0, hasPen = h.penaltyTimes>0 && h.penaltyMin>0, trigDays, trigVal, stepV, stepD;
    if (h.triggerValue === undefined){
      if (hasReward && !hasPen){ trigDays=h.requiredCount; trigVal=h.baseRewardMin; stepV=h.rewardStep||0; stepD=0; }
      else if (!hasReward && hasPen){ trigDays=h.penaltyTimes; trigVal=-h.penaltyMin; stepV=(h.penaltyStep!==false)?h.penaltyMin:0; stepD=0; }
      else if (hasReward && hasPen){ trigDays=h.requiredCount; trigVal=h.baseRewardMin; stepV=h.rewardStep||0; stepD=0; h.penaltyTimes=0; h.penaltyMin=0; }
      else { trigDays=h.requiredCount; trigVal=0; stepV=0; stepD=0; }
    } else {
      trigDays=h.triggerDays; trigVal=h.triggerValue; stepV=h.stepValue||0; stepD=0;
    }
    if (type==='time' && trigVal<0) trigVal = 0;
    if (type==='time' && stepV<0) stepV = 0;
    return { id:h.id||uid(), name:h.name||'未命名', type:type, icon:h.icon||'star', color:h.color||COLORS[0], cycleDays:h.cycleDays||7, anchorDate:h.anchorDate||mondayOf(), requiredCount:h.requiredCount||(h.cycleDays||7), minMinutes:h.minMinutes||0, goalMinutes:h.goalMinutes||0, baseRewardMin:h.baseRewardMin||0, boostEnabled:!!h.boostEnabled, boostThresholdMin:h.boostThresholdMin||60, boostRewardMin:h.boostRewardMin||0, penaltyMin:h.penaltyMin||0, penaltyTimes:h.penaltyTimes||0, penaltyStep:h.penaltyStep!==false, rewardStep:h.rewardStep||0, triggerDays:trigDays, triggerValue:trigVal, stepValue:stepV, stepMode:'mean', stepDelta:0, remark:h.remark||'', enabled:h.enabled!==false, deleted:!!h.deleted, createdAt:h.createdAt };
  });
  d.checkins = d.checkins||[];
  d.settlements = d.settlements||[];
  d.redemptions = d.redemptions||[];
  d.usages = d.usages||[];
  d.account = d.account||{ balanceMin:0, totalEarnedMin:0, totalRedeemedMin:0, totalRedeemedYuan:0 };
  d.account.totalUsedMin = d.account.totalUsedMin||0;
  d.exchangeRate = (d.exchangeRate && d.exchangeRate.minutes > 0) ? { minutes:+d.exchangeRate.minutes, yuan:+d.exchangeRate.yuan } : { minutes:30, yuan:10 };
  return d;
}
/* 软件建立日期：取数据中最早的日期证据（考核项创建/锚点、最早打卡），缺失时用今天 */
function ensureAppBirth(){
  if (state && state.createdAt) return state.createdAt;
  var dates = [];
  (state.habits||[]).forEach(function(h){ if (h.createdAt) dates.push(h.createdAt); if (h.anchorDate) dates.push(h.anchorDate); });
  (state.checkins||[]).forEach(function(c){ if (c.date) dates.push(c.date); });
  dates.sort();
  var birth = dates.length ? dates[0] : HabitEngine.today();
  state.createdAt = birth;
  try{ localStorage.setItem(Store.KEY, JSON.stringify(state)); }catch(e){}
  return birth;
}
function mondayOf(){
  var t = HabitEngine.today();
  var d = HabitEngine.parse(t);
  var off = (d.getDay()+6)%7;
  return HabitEngine.addDays(t, -off);
}

    ],

function cycleSettled(habitId, cyc){

/* ==== 基础 UI 工具 ==== */
function toast(msg, type){

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function cnDay(dateStr){
  var d = HabitEngine.parse(dateStr);
  var w = ['周日','周一','周二','周三','周四','周五','周六'];
  return w[d.getDay()];

}
// 进度显示目标：有触发规则=触发次数 N；无规则=原达标次数
function targetOf(h){ return h.triggerValue!==0 ? (h.triggerDays||1) : (h.requiredCount||h.cycleDays); }
function escHabitRule(h){
  var parts = [];
  parts.push('每'+h.cycleDays+'天为 1 个考核周期');
  if (h.minMinutes>0) parts.push('单次 ≥ '+h.minMinutes+' 分钟');
  if (h.triggerValue !== 0){
    var mainTxt = h.triggerValue>0 ? '打卡达到 '+h.triggerDays+' 次奖励 +'+h.triggerValue+' 分钟' : '打卡达到 '+h.triggerDays+' 次扣 '+(-h.triggerValue)+' 分钟';
    var stTxt = h.stepValue>0 ? '，超过后每多 1 次 +'+h.stepValue+' 分钟' : (h.stepValue<0 ? '，超过后每多 1 次扣 '+(-h.stepValue)+' 分钟' : '');
    parts.push(mainTxt+stTxt);
  }
  if (h.boostEnabled && h.minMinutes>0) parts.push('全勤且每次 ≥ '+h.boostThresholdMin+' 分钟奖励 +'+h.boostRewardMin+' 分钟');
  if (h.remark) parts.push('说明：'+h.remark);
  return parts.join(' · ');
}
function escHabitShort(h){
  var tgt = targetOf(h);
  var freq = tgt===h.cycleDays ? '每天 1 次' : '每周期 '+tgt+' 次';
  var dur = h.minMinutes>0 ? ' · ≥'+h.minMinutes+' 分钟' : '';
  var stS = h.stepValue>0 ? '，每多 1 次 +'+h.stepValue+' 分钟' : (h.stepValue<0 ? '，每多 1 次扣 '+(-h.stepValue)+' 分钟' : '');
  var main = '';
  if (h.triggerValue > 0){
    main = '打卡 '+h.triggerDays+' 次奖 +'+h.triggerValue+' 分钟'+stS;
  } else if (h.triggerValue < 0){
    main = '打卡 '+h.triggerDays+' 次扣 '+(-h.triggerValue)+' 分钟'+stS;
  }
  var boost = (h.boostEnabled && h.minMinutes>0) ? '；全勤且每次≥'+h.boostThresholdMin+' 分钟则 +'+h.boostRewardMin : '';
  var rk = h.remark ? '；说明：'+h.remark : '';
  return freq + dur + (main?(' · '+main):'') + boost + rk;
}

/* ==== 结算 ==== */
function autoSettle(){
  var t = HabitEngine.today();
  var notes = [];
  state.habits.forEach(function(h){
    if (!h.enabled || h.deleted) return;
    var prev = HabitEngine.prevCycleOf(h, t);
    if (prev.end >= t) return;
    if (prev.end < h.createdAt) return;
    if (cycleSettled(h.id, prev)) return;
    var res = HabitEngine.settle(h, state.checkins, prev);
    state.settlements.push({ id:uid(), habitId:h.id, cycleStart:prev.start, cycleEnd:prev.end, count:res.count, required:res.required, rewardMin:res.reward, boost:res.boost, status:res.status, penaltyMin:res.penalty, settledAt:t });
    if (res.reward>0){ state.account.balanceMin += res.reward; state.account.totalEarnedMin += res.reward; }
    if (res.penalty>0){ state.account.balanceMin -= res.penalty; state.account.totalEarnedMin -= res.penalty; /* 允许扣成负值（欠账） */ }
    if (res.status==='boost') notes.push({ n:h.name, txt:'上个周期全勤且每次≥'+h.boostThresholdMin+' 分钟，奖励 +'+res.reward+' 分钟娱乐时间', good:true });
    else if (res.status==='pen') notes.push({ n:h.name, txt:'上个周期达到 '+res.count+'/'+res.required+' 次，扣除 '+res.penalty+' 分钟娱乐时间', good:false });
    else if (res.status==='full' && res.reward>0) notes.push({ n:h.name, txt:'上个周期达标 '+res.count+'/'+res.required+'，奖励 +'+res.reward+' 分钟娱乐时间', good:true });
    else if (res.status==='miss') notes.push({ n:h.name, txt:'上个周期未达标（'+res.count+'/'+res.required+'），无奖励', good:false });
  });
  if (notes.length){
    Store.save();
    setTimeout(function(){ notes.forEach(function(nt){ toast(nt.n+'：'+nt.txt, nt.good?'good':'warn'); }); }, 300);
  }
}
function doCheckin(habitId, date, minutes){
  var h = habitById(habitId);
  if (!h) return false;
  var cyc = HabitEngine.currentCycle(h, date);
  if (cycleSettled(h.id, cyc)){ toast('该考核周期已结算，无法再修改记录', 'warn'); return false; }
  // 一天可多次记录：每次追加一条（打卡型每 1 条算 1 次达标；时间型每条按时长独立判定）
  state.checkins.push({ id:uid(), habitId:h.id, date:date, minutes:(minutes==null?null:minutes), createdAt:HabitEngine.today() });
  Store.save();
  return true;
}
function removeCheckin(habitId, date){
  for (var i=state.checkins.length-1;i>=0;i--)
    if (state.checkins[i].habitId===habitId && state.checkins[i].date===date){ state.checkins.splice(i,1); break; }
  Store.save();
}

function renderToday(){

    var todayList = state.checkins.filter(function(c){ return c.habitId===h.id && c.date===t; });
    var todayOkList = todayList.filter(function(c){ return HabitEngine.isDone(h, c, 0); });
    var doneToday = todayOkList.length > 0;
    var isPen = h.triggerValue < 0;
    if (isPen) pnCount += todayList.length;
    else if (doneToday) rwDone++;
    else rwPend++;
    var pct = Math.min(100, Math.round(st.count/targetOf(h)*100));

      // 惩罚规则：简短警示标语（不显示「今日已达成」）
      var Np = targetOf(h), remain = Np - st.count, warnTxt;
      if (remain > 0) warnTxt = '距扣 '+(-h.triggerValue)+' 分钟还差 '+remain+' 次';

        '<button class="btn btn-ghost btn-sm" data-action="checkin" data-id="'+h.id+'">再'+(isTime?'记录':'打卡')+'</button>';
    } else {
      right = '<button class="btn btn-primary" data-action="checkin" data-id="'+h.id+'">'+(isTime?'记录':'打卡')+'</button>';
    }
    // 修改误打卡：今天有记录时提供修改按钮
    if (todayList.length) right += '<button class="btn btn-ghost btn-sm" data-action="edit-checkin" data-id="'+h.id+'">修改</button>';
    var cardHtml = '<div class="habit-card">'+
      '<div class="habit-top">'+
        '<div class="h-ico" style="background:'+h.color+'1A;color:'+h.color+'">'+iconSvg(h.icon)+'</div>'+
        '<div style="flex:1;min-width:0"><div class="h-name">'+esc(h.name)+' <span class="tag '+(h.type==='time'?'tag-boost':'tag-r')+'">'+(h.type==='time'?'时间型':'打卡型')+'</span></div><div class="h-rule">'+escHabitShort(h)+'</div></div>'+
        '<div class="h-progress">'+
          '<div class="hp-bar"><div class="hp-fill" style="width:'+pct+'%;background:'+(st.count>=targetOf(h)?'var(--success)':h.color)+'"></div></div>'+
          '<div class="hp-nums"><span>本周 '+st.count+' / '+targetOf(h)+'</span><span>'+pct+'%</span></div>'+
        '</div>'+
        '<div class="h-actions">'+right+'</div>'+
      '</div>'+
    '</div>';
    if (h.triggerValue < 0) penCards.push(cardHtml);
    else rewardCards.push(cardHtml);
  });
  var cycleInfo = '';
  if (hs.length){ var c0 = HabitEngine.currentCycle(hs[0], t); cycleInfo = '<span class="tip">本周期 '+fmtDateCN(c0.start)+' ~ '+fmtDateCN(c0.end)+'</span>'; }
  var hero = '<div class="today-hero">'+
    '<div class="hero-date"><span class="d1">'+fmtDateCN(t)+'</span><span class="d2">今日奖励打卡 已完成 '+rwDone+' · 待完成 '+rwPend+'</span></div>'+
    '<div class="hero-stats">'+
      '<div class="hstat"><div class="n done">'+rwDone+'<span class="u"> / '+rwPend+'</span></div><div class="l">奖励打卡(已完成/待完成)</div></div>'+
      '<div class="hstat"><div class="n pending">'+pnCount+'</div><div class="l">惩罚打卡(次)</div></div>'+
      '<div class="hstat"><div class="n">'+state.account.balanceMin+'</div><div class="l">娱乐余额(分钟)</div></div>'+
    '</div>'+
  '</div>';
  var body = '';
  if (rewardCards.length || penCards.length){
    if (rewardCards.length) body += '<div class="grp-title grp-rw">奖励打卡 <span class="cnt">'+rewardCards.length+' 项</span></div>' + rewardCards.join('');
    if (penCards.length) body += '<div class="grp-title grp-pn">惩罚打卡 <span class="cnt">'+penCards.length+' 项</span></div>' + penCards.join('');
  } else {
    body = '<div class="empty"><div class="t">还没有考核项</div><div>点击「考核项」页新增一个考核项，比如扔垃圾、阅读。</div></div>';
  }
  var backfill = hs.length ? '<button class="btn btn-primary btn-block" data-action="backfill">补打卡</button>' : '';
  /* 首页三子页：今日打卡 / 娱乐账户 / 我的主页（v3.8.0） */
  var homeTab = view.homeTab || 'checkin';
  var homeTabs = '<div class="feed-tabs">' +
    '<div class="ft ' + (homeTab==='checkin'?'active':'') + '" data-action="home-tab" data-ht="checkin">今日打卡</div>' +
    '<div class="ft ' + (homeTab==='account'?'active':'') + '" data-action="home-tab" data-ht="account">娱乐账户</div>' +
    '<div class="ft ' + (homeTab==='profile'?'active':'') + '" data-action="home-tab" data-ht="profile">我的主页</div>' +
    '</div>';
  var homeBody;
  if (homeTab === 'account'){
    homeBody = renderAccount();
  } else if (homeTab === 'profile'){
    // v3.8.0：首页「我的主页」子页 = 当前登录用户本人主页（内嵌 renderUserProfile，省略返回栏）
    var meEmail = ((Auth.user||{}).email||'').toLowerCase();
    if (meEmail && view.profileEmail !== meEmail){
      view.profileEmail = meEmail;
      _upData = null;
      loadUserProfile(meEmail);
    } else if (meEmail && !_upData){
      loadUserProfile(meEmail);
    }
    homeBody = '<div class="my-profile-embed">' + renderUserProfile({embed:true}) + '</div>';
  } else {
    homeBody = hero + '<div class="view-title">今日考核 '+cycleInfo+'</div>' + body + (backfill?'<div style="margin-top:14px">'+backfill+'</div>':'');
  }
  // v3.8.0：仅「我的主页」子页渲染底部固定发帖胶囊按钮
  var composeFab = '';
  if (homeTab === 'profile' && meEmail){
    composeFab = '<button type="button" class="my-compose-fab" data-action="open-compose" title="发帖"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>发帖</button>';
  }
  return homeTabs + homeBody + composeFab;
}

/* ==== 视图：考核项 ==== */
function renderHabits(){
  var t = HabitEngine.today();
  var rw = [], pn = [], paused = [], del = [];
  state.habits.forEach(function(h){
    if (h.deleted){
      /* 已删除：置灰简化卡片，仅显示名称/类型/删除标记，无操作按钮 */
      var delCard = '<div class="habit-card" style="opacity:.55;filter:grayscale(.6)">'+
        '<div class="habit-top">'+
          '<div class="h-ico" style="background:#EEF0F4;color:#9AA0AE">'+iconSvg(h.icon)+'</div>'+
          '<div style="flex:1;min-width:0">'+
            '<div class="h-name" style="color:var(--muted)">'+esc(h.name)+' <span class="tag tag-none">已删除</span></div>'+
            '<div class="h-rule" style="-webkit-line-clamp:1">'+escHabitShort(h)+'</div>'+
          '</div>'+
        '</div>'+
      '</div>';
      del.push(delCard);
      return;
    }
    var cyc = HabitEngine.currentCycle(h, t);
    var st = HabitEngine.cycleStats(h, state.checkins, cyc);
    var pct = Math.min(100, Math.round(st.count/targetOf(h)*100));
    var statusPill = h.enabled
      ? '<span class="pill '+(st.count>=targetOf(h)?'pill-success':'')+'">本周期 '+st.count+'/'+targetOf(h)+'</span>'
      : '<span class="pill pill-none">已暂停</span>';
    var cardHtml = '<div class="habit-card">'+
      '<div class="habit-top">'+
        '<div class="h-ico" style="background:'+h.color+'1A;color:'+h.color+'">'+iconSvg(h.icon)+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div class="h-name">'+esc(h.name)+' <span class="tag '+(h.type==='time'?'tag-boost':'tag-r')+'">'+(h.type==='time'?'时间型':'打卡型')+'</span> '+statusPill+'</div>'+
          '<div class="h-rule">'+escHabitRule(h)+'</div>'+
          '<div class="h-progress" style="margin:8px 0 0"><div class="hp-bar"><div class="hp-fill" style="width:'+pct+'%;background:'+(st.count>=targetOf(h)?'var(--success)':h.color)+'"></div></div><div class="hp-nums"><span>当前周期 '+st.count+' / '+targetOf(h)+' 次</span><span>'+pct+'%</span></div></div>'+
        '</div>'+
      '</div>'+
      '<div class="habit-mgmt">'+
        '<button class="mgmt-btn btn-ghost" style="color:var(--text)" data-action="edit-habit" data-id="'+h.id+'">编辑</button>'+
        '<button class="mgmt-btn btn-ghost" style="color:var(--text)" data-action="toggle-habit" data-id="'+h.id+'">'+(h.enabled?'暂停':'启用')+'</button>'+
        '<button class="mgmt-btn btn-danger" data-action="del-habit" data-id="'+h.id+'" style="margin-left:auto">删除</button>'+
      '</div>'+
    '</div>';
    if (!h.enabled) paused.push(cardHtml);
    else if (h.triggerValue < 0) pn.push(cardHtml);
    else rw.push(cardHtml);
  });
  var activeCount = state.habits.length - del.length;
  var cards = '';
  if (rw.length) cards += '<div class="grp-title grp-rw">奖励打卡 <span class="cnt">'+rw.length+' 项</span></div>' + rw.join('');
  if (pn.length) cards += '<div class="grp-title grp-pn">惩罚打卡 <span class="cnt">'+pn.length+' 项</span></div>' + pn.join('');
  if (paused.length) cards += '<div class="grp-title"><span class="cnt" style="margin-left:0">已暂停 '+paused.length+' 项</span></div>' + paused.join('');
  if (del.length) cards += '<div class="grp-title"><span class="cnt" style="margin-left:0">已删除 '+del.length+' 项（移入已删除，历史记录保留）</span></div>' + del.join('');
  var add = '<button class="btn btn-primary btn-block" data-action="add-habit" style="padding:13px">+ 新增考核项</button>';
  return '<div class="view-title">考核项管理 <span class="tip">'+activeCount+' 项</span></div>'+
    '<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;margin-bottom:12px;box-shadow:var(--shadow)"><div class="r-line"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span style="font-size:12.5px;color:var(--muted)">每到一个周期结束，系统自动结算：达成条件发奖励，未达成无奖励（默认不扣已积累的娱乐时间）。奖励与规则均可自定义。</span></div></div>'+
    cards + '<div style="margin-top:14px">'+add+'</div>';
}

/* ==== 视图：娱乐账户 ==== */
function renderAccount(){
  var ac = state.account;
  var rt = state.exchangeRate || { minutes:30, yuan:10 };
  var q = HabitEngine.redeemQuote(ac.balanceMin, rt);
  // 合并最近支出（兑换 + 使用），按日期倒序
  var items = [];
  state.redemptions.forEach(function(r){ items.push({ date:r.date, type:'redeem', minutes:r.minutes, yuan:r.yuan, note:r.note||'' }); });
  state.usages.forEach(function(u){ items.push({ date:u.date, type:'use', minutes:u.minutes, yuan:null, note:u.note||'' }); });
  items.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  var spent = items.slice(0,15).map(function(it){
    if (it.type==='redeem') return '<div class="rec-item"><div class="info"><div class="nm">兑换人民币'+(it.note?' · '+esc(it.note):'')+'</div><div class="dt">'+fmtDateCN(it.date)+'</div></div><div class="val minus">-'+it.minutes+' 分钟</div><div class="val plus" style="margin-left:10px">+¥'+it.yuan+'</div></div>';
    return '<div class="rec-item"><div class="info"><div class="nm">使用娱乐时间'+(it.note?' · '+esc(it.note):'')+'</div><div class="dt">'+fmtDateCN(it.date)+'</div></div><div class="val minus">-'+it.minutes+' 分钟</div></div>';
  }).join('') || '<div class="empty"><div class="t">还没有支出记录</div><div>娱乐时间可兑换成人民币，也可直接使用。</div></div>';
  return ''+
    '<div class="acct-hero">'+
      '<div class="lab">'+(ac.balanceMin<0?'当前娱乐时间余额（欠账中，赚回的奖励会先还账）':'当前娱乐时间余额（可累计，上不封顶）')+'</div>'+
      '<div class="big" id="acct-big" style="'+(ac.balanceMin<0?'color:var(--danger)':'')+'">'+ac.balanceMin+' <span style="font-size:20px;font-weight:600">分钟</span></div>'+
      '<div class="sub">'+(ac.balanceMin<0?'按每 <b>'+rt.minutes+' 分钟</b> = <b>¥'+rt.yuan+'</b> 计算，当前欠 <b>¥'+(-q.yuan)+'</b>（赚回后先还账）':'按每 <b>'+rt.minutes+' 分钟</b> = <b>¥'+rt.yuan+'</b> 计算 ≈ <b>¥'+q.yuan+'</b>（可兑换 '+q.units+' 个单位）')+'</div>'+
    '</div>'+
    '<div class="acct-stats">'+
      '<div class="acct-stat"><div class="n" style="color:'+(ac.totalEarnedMin<0?'var(--danger)':'var(--success)')+'">'+ac.totalEarnedMin+'</div><div class="l">累计获得(分钟)</div></div>'+
      '<div class="acct-stat"><div class="n" style="color:var(--gold)">¥'+ac.totalRedeemedYuan+'</div><div class="l">累计换得(元)</div></div>'+
    '</div>'+
    '<div class="redeem-box">'+
      '<div class="view-title" style="margin-top:0">1 · 兑换人民币</div>'+
      '<div class="rate-row"><span class="rate-lab">兑换比例</span><input class="rate-inp" type="number" id="rate-min" min="1" step="1" value="'+rt.minutes+'"><span class="rate-eq">分钟 = ¥</span><input class="rate-inp" type="number" id="rate-yuan" min="0.01" step="0.5" value="'+rt.yuan+'"><button class="btn btn-ghost btn-sm" data-action="save-rate" style="margin-left:auto">保存比例</button></div>'+
      '<div class="redeem-opt">'+
        '<input class="inp" type="number" id="redeem-inp" min="'+rt.minutes+'" step="'+rt.minutes+'" placeholder="输入要兑换的分钟数（'+rt.minutes+' 的倍数）">'+
        '<button class="btn" style="background:var(--gold);color:#fff" data-action="redeem-ok">确认兑换</button>'+
        '<input class="inp" type="text" id="redeem-note" maxlength="40" placeholder="兑换用途（选填，如：买零食 / 零花钱）">'+
      '</div>'+
      '<div class="redeem-hint" id="redeem-hint">每 <b>'+rt.minutes+' 分钟</b> = <b>¥'+rt.yuan+'</b>，比例可自行调整，上不封顶。'+(ac.balanceMin<0?'当前余额 '+ac.balanceMin+' 分钟（欠账），需先赚回娱乐时间才能兑换。':'当前余额 '+ac.balanceMin+' 分钟，最多可兑换 <b>¥'+q.yuan+'</b>（'+q.minutes+' 分钟）。')+'</div>'+
    '</div>'+
    '<div class="redeem-box" style="border-color:var(--primary)">'+
      '<div class="view-title" style="margin-top:0">2 · 使用娱乐时间</div>'+
      '<div class="redeem-opt">'+
        '<input class="inp" type="number" id="use-inp" min="1" step="1" placeholder="输入要使用的分钟数（如 45）">'+
        '<button class="btn btn-primary" data-action="use-ok">确认使用</button>'+
        '<input class="inp" type="text" id="use-note" maxlength="40" placeholder="使用用途（选填，如：玩游戏 / 看动画）">'+
      '</div>'+
      '<div class="redeem-hint" id="use-hint">'+(ac.balanceMin<0?'当前余额 '+ac.balanceMin+' 分钟（欠账），需先赚回娱乐时间才能使用。':'直接从余额中扣除对应分钟，例如今天想玩 <b>45 分钟</b> 就扣 45 分钟。当前余额 '+ac.balanceMin+' 分钟，最多可用 <b>'+ac.balanceMin+' 分钟</b>。')+'</div>'+
    '</div>'+
    '<div class="view-title">最近支出记录</div>'+spent;
}

/* ==== 视图：历史记录 ==== */
function renderHistory(){
  var t = view.histTab || 'settle';
  var tabHtml = '<div class="tabs" style="position:static;margin-bottom:14px">'+
    '<button class="tab '+(t==='settle'?'active':'')+'" data-action="hist-tab" data-ht="settle">结算记录</button>'+
    '<button class="tab '+(t==='checkin'?'active':'')+'" data-action="hist-tab" data-ht="checkin">打卡记录</button>'+
    '<button class="tab '+(t==='redeem'?'active':'')+'" data-action="hist-tab" data-ht="redeem">兑换记录</button>'+
    '<button class="tab '+(t==='use'?'active':'')+'" data-action="hist-tab" data-ht="use">使用记录</button>'+
  '</div>';
  var content = '';
  if (t==='settle'){
    var rwS = [], pnS = [], delS = [];
    state.settlements.slice().reverse().forEach(function(s){
      var h = habitById(s.habitId);
      var nm = h ? h.name : '(已删除)';
      var tag = s.status==='boost' ? '<span class="tag tag-boost">强化</span>' : (s.status==='full' ? '<span class="tag tag-full">达标</span>' : '<span class="tag tag-none">未达标</span>');
      var val = s.rewardMin>0 ? '<span class="val plus">+'+s.rewardMin+' 分钟</span>' : (s.penaltyMin>0 ? '<span class="val minus">-'+s.penaltyMin+' 分钟</span>' : '<span class="val zero">0</span>');
      var item = '<div class="rec-item">'+
        '<div class="info"><div class="nm">'+esc(nm)+' '+tag+'</div><div class="dt">'+fmtDateCN(s.cycleStart)+' ~ '+fmtDateCN(s.cycleEnd)+' · 达标 '+s.count+'/'+s.required+'</div></div>'+
        val+'</div>';
      if (!h || h.deleted) delS.push(item);
      else if (h.triggerValue < 0) pnS.push(item);
      else rwS.push(item);
    });
    var list = '';
    if (rwS.length) list += '<div class="grp-title grp-rw">奖励打卡 <span class="cnt">'+rwS.length+' 条</span></div>' + rwS.join('');
    if (pnS.length) list += '<div class="grp-title grp-pn">惩罚打卡 <span class="cnt">'+pnS.length+' 条</span></div>' + pnS.join('');
    if (delS.length) list += '<div class="grp-title"><span class="cnt" style="margin-left:0">已删除考核 '+delS.length+' 条</span></div>' + delS.join('');
    content = list || '<div class="empty"><div class="t">暂无结算记录</div><div>考核周期结束后会自动结算。</div></div>';
  } else if (t==='checkin'){
    var byDate = {};
    state.checkins.forEach(function(c){ (byDate[c.date] = byDate[c.date]||[]).push(c); });
    var days = Object.keys(byDate).sort().reverse();
    var rwC = [], pnC = [], delC = [];
    days.forEach(function(d){
      var rwItems = [], pnItems = [], delItems = [];
      byDate[d].forEach(function(c){
        var h = habitById(c.habitId);
        var nm = h ? h.name : '(已删除)';
        var mins;
        if (c.minutes!=null) mins = '<span class="tag tag-r">'+c.minutes+' 分钟</span>';
        else if (h && h.type==='check') mins = '<span class="tag tag-full">完成</span>';
        else mins = '<span class="tag" style="background:#F1F2F6;color:var(--muted)">无时长</span>';
        var item = '<div class="rec-item"><div class="info"><div class="nm">'+esc(nm)+'</div></div>'+mins+'</div>';
        if (!h || h.deleted) delItems.push(item);
        else if (h.triggerValue < 0) pnItems.push(item);
        else rwItems.push(item);
      });
      if (rwItems.length) rwC.push('<div class="rec-group"><div class="rec-day">'+fmtDateCN(d)+'</div>'+rwItems.join('')+'</div>');
      if (pnItems.length) pnC.push('<div class="rec-group"><div class="rec-day">'+fmtDateCN(d)+'</div>'+pnItems.join('')+'</div>');
      if (delItems.length) delC.push('<div class="rec-group"><div class="rec-day">'+fmtDateCN(d)+'</div>'+delItems.join('')+'</div>');
    });
    content = '';
    if (rwC.length) content += '<div class="grp-title grp-rw">奖励打卡 <span class="cnt">'+rwC.length+' 天</span></div>' + rwC.join('');
    if (pnC.length) content += '<div class="grp-title grp-pn">惩罚打卡 <span class="cnt">'+pnC.length+' 天</span></div>' + pnC.join('');
    if (delC.length) content += '<div class="grp-title"><span class="cnt" style="margin-left:0">已删除考核 '+delC.length+' 天</span></div>' + delC.join('');
    content = content || '<div class="empty"><div class="t">暂无打卡记录</div><div>每天在「今日打卡」页记录完成情况。</div></div>';
    content = content + '<div class="view-title" style="margin-top:20px">数据备份</div>'+
      '<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)">'+
      '<div class="redeem-hint" style="margin-top:0">所有数据保存在本机浏览器中。建议定期导出备份，换浏览器或清缓存前先导出。</div>'+
      '<div class="data-ops"><button class="btn btn-ghost" data-action="export-data">导出备份(JSON)</button><button class="btn btn-ghost" data-action="import-data">导入备份</button><input type="file" id="import-file" accept=".json,application/json" style="display:none"></div></div>';
  } else if (t==='redeem'){
    var reds = state.redemptions.slice().reverse().map(function(r){
      return '<div class="rec-item"><div class="info"><div class="nm">兑换娱乐时间'+(r.note?' · '+esc(r.note):'')+'</div><div class="dt">'+fmtDateCN(r.date)+'</div></div><div class="val minus">-'+r.minutes+' 分钟</div><div class="val plus" style="margin-left:10px">¥'+r.yuan+'</div></div>';
    }).join('') || '<div class="empty"><div class="t">暂无兑换记录</div></div>';
    content = reds;
  } else {
    var uses = state.usages.slice().reverse().map(function(u){
      return '<div class="rec-item"><div class="info"><div class="nm">使用娱乐时间'+(u.note?' · '+esc(u.note):'')+'</div><div class="dt">'+fmtDateCN(u.date)+'</div></div><div class="val minus">-'+u.minutes+' 分钟</div></div>';
    }).join('') || '<div class="empty"><div class="t">暂无使用记录</div><div>在「娱乐账户」页可将娱乐时间直接使用掉。</div></div>';
    content = uses;
  }
  return '<div class="view-title">历史记录</div>'+tabHtml+content;
}

/* ==== 视图：我的（个人中心） ==== */
function renderMe(){

  var card = '<div class="me-card">' + avHtml +
    '<div style="flex:1;min-width:0"><div class="mn">' + esc(u.nickname || '小笨猪') + '</div>' +
    '<div class="ma">' + esc(u.email || '') + '</div></div></div>';
  var tabs = '<div class="feed-tabs">' +
    '<div class="ft ' + (view.meTab==='habits'?'active':'') + '" data-action="me-tab" data-mt="habits">考核项管理</div>' +
    '<div class="ft ' + (view.meTab==='history'?'active':'') + '" data-action="me-tab" data-mt="history">历史记录</div>' +

/* ==== 保存考核项 ==== */
function saveHabitForm(){
  var name = (document.getElementById('f-name').value||'').trim();
  if (!name){ toast('请填写考核项名称','warn'); return; }
  var type = formType || 'check';
  var cycleDays = parseInt(document.getElementById('f-cycle').value,10)||7;
  var anchor = document.getElementById('f-anchor').value || mondayOf();
  var trigd = parseInt(document.getElementById('f-trigd').value,10)||0;
  var trigv = parseInt(document.getElementById('f-trigv').value,10)||0;
  var stepv = parseInt(document.getElementById('f-stepv').value,10)||0;
  var remark = (document.getElementById('f-remark').value||'').trim();
  var minmin = 0, goal = 0, boost = false, bth = 60, brew = 0;
  if (trigv!==0 && trigd<1){ toast('启用奖惩规则需填写打卡次数 N（正数）','warn'); return; }
  if (type==='time' && trigv<0){ toast('时间型不设惩罚：触发值请填正数（奖励）或 0','warn'); return; }
  if (type==='time' && stepv<0){ toast('时间型不设惩罚：每档量请填正数（多奖）或 0','warn'); return; }
  if (type==='time'){
    minmin = parseInt(document.getElementById('f-minmin').value,10)||0;
    goal = parseInt(document.getElementById('f-goal').value,10)||0;
    var bEl = document.getElementById('f-boost');
    if (bEl && bEl.checked){
      if (minmin<=0){ toast('启用强化奖励需先设置「单次最低时长」','warn'); return; }
      boost = true;
      bth = parseInt(document.getElementById('f-bth').value,10)||minmin;
      brew = parseInt(document.getElementById('f-brew').value,10)||0;
      if (bth < minmin){ toast('强化阈值应 ≥ 单次最低时长','warn'); return; }
    }
  }
  var obj = { name:name, type:type, icon:formIcon, color:formColor, cycleDays:cycleDays, anchorDate:anchor, requiredCount:(trigv>0?trigd:cycleDays), minMinutes:minmin, goalMinutes:goal, baseRewardMin:(trigv>0?trigv:0), rewardStep:stepv, boostEnabled:boost, boostThresholdMin:bth, boostRewardMin:brew, penaltyMin:0, penaltyTimes:0, penaltyStep:true, triggerDays:trigd, triggerValue:trigv, stepValue:stepv, stepMode:'mean', stepDelta:0, remark:remark };
  if (editingId){
    var h = habitById(editingId);
    var anchorChanged = h.anchorDate!==anchor;
    for (var k in obj) h[k] = obj[k];
    toast(anchorChanged?'已保存（起始日变更，周期已重新划分）':'已保存考核项','good');
  } else {
    obj.id = uid(); obj.enabled = true; obj.createdAt = HabitEngine.today();
    state.habits.push(obj);
    toast('已添加考核项','good');
  }
  Store.save(); closeModal(); render();
}

/* ==== 兑换 / 使用 ==== */
function doRedeem(){
  var inp = document.getElementById('redeem-inp');
  var v = parseInt(inp.value,10);
  if (isNaN(v) || v<=0){ toast('请输入兑换分钟数','warn'); return; }
  var q = HabitEngine.redeemQuote(v, state.exchangeRate);
  if (q.minutes<=0){ toast('至少 '+state.exchangeRate.minutes+' 分钟才能兑换','warn'); return; }
  if (q.minutes > state.account.balanceMin){ toast(state.account.balanceMin<0?'余额为负（欠账），请先赚回娱乐时间':'娱乐时间余额不足','warn'); return; }
  if (!confirm('确认兑换 '+q.minutes+' 分钟娱乐时间 = ¥'+q.yuan+'？兑换后不可撤销。')) return;
  state.account.balanceMin -= q.minutes;
  state.account.totalRedeemedMin += q.minutes;
  state.account.totalRedeemedYuan += q.yuan;
  state.redemptions.push({ id:uid(), minutes:q.minutes, yuan:q.yuan, date:HabitEngine.today(), note:(document.getElementById('redeem-note').value||'').trim() });
  Store.save(); render();
  toast('已兑换 ¥'+q.yuan+'（'+q.minutes+' 分钟）','good');
}
function doUse(){
  var inp = document.getElementById('use-inp');
  var v = parseInt(inp.value,10);
  if (isNaN(v) || v<=0){ toast('请输入使用的分钟数','warn'); return; }
  if (v > state.account.balanceMin){ toast(state.account.balanceMin<0?'余额为负（欠账），请先赚回娱乐时间':'娱乐时间余额不足','warn'); return; }
  if (!confirm('确认使用 '+v+' 分钟娱乐时间？将从余额中扣除。')) return;
  state.account.balanceMin -= v;
  state.account.totalUsedMin += v;
  state.usages.push({ id:uid(), minutes:v, date:HabitEngine.today(), note:(document.getElementById('use-note').value||'').trim() });
  Store.save(); render();
  toast('已使用 '+v+' 分钟娱乐时间','good');
}

/* ==== 数据导出 / 导入 ==== */
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '考核小管家备份-'+HabitEngine.today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast('备份已导出','good');
}
function importDataFile(file){
  if (!file) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if (!d || !d.habits || !d.account){ throw new Error('bad'); }
      state = normalize(d);
      Store.save(); render();
      toast('导入成功：'+state.habits.length+' 个考核项','good');
    }catch(e){ toast('导入失败：文件格式不正确','warn'); }
  };
  rd.readAsText(file);
}

function saveRate(){
  var rm = parseInt(document.getElementById('rate-min').value,10);
  var ry = parseFloat(document.getElementById('rate-yuan').value);
  if (isNaN(rm) || rm<=0){ toast('请输入有效的分钟数（大于 0）','warn'); return; }
  if (isNaN(ry) || ry<=0){ toast('请输入有效的金额（大于 0）','warn'); return; }
  state.exchangeRate = { minutes: rm, yuan: Math.round(ry*100)/100 };
  Store.save(); render();
  toast('兑换比例已更新：每 '+rm+' 分钟 = ¥'+state.exchangeRate.yuan,'good');

function fmtHM(s){
  if (!s) return '';
  var d = new Date(String(s).replace(' ','T'));
  if (isNaN(d.getTime())) return String(s).slice(11,16);
  var hh = String(d.getHours()).padStart(2,'0');
  var mm = String(d.getMinutes()).padStart(2,'0');
  var sameDay = (function(){
    var now = new Date();
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  })();
  if (sameDay) return hh + ':' + mm;
  return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

    ensurePeer = postJSON('kaohe-api/dms.php?action=conversations', { token: Auth.token })
      .then(function(res){
        if (apiFail(res)) return;
        if (res.json && res.json.ok){
          view.dm.list = res.json.items || [];
          view.dm.conversationsLoaded = true;
          for (var j=0;j<view.dm.list.length;j++){
            if (view.dm.list[j].conversation_id === convId){
              view.dm.peer = view.dm.list[j].peer;
              view.dm.canSend = view.dm.list[j].can_send !== false;

    (Auth.token ? '&token=' + encodeURIComponent(Auth.token) : '');
